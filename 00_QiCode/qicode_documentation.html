. My Truth","id":"article-1-my-truth"},{"level":3,"text":"Sec. 1.01.010. Truth Before Performance","id":"sec-101010-truth-before-performance"},{"level":3,"text":"Sec. 1.01.020. Witness","id":"sec-101020-witness"},{"level":3,"text":"Sec. 1.01.030. Non-Erasure","id":"sec-101030-non-erasure"}],"order":11},{"id":"title_01_trutharticle_02_law_of_onemd","name":"article_02_law_of_one.md","relativePath":"title_01_truth/article_02_law_of_one.md","category":"TITLE 01 TRUTH","title":"Article 2. Law of One","summary":"","status":"publish","rawBody":"## Article 2. Law of One\n\nStable ID: `T01.A02`\n\n### Sec. 1.02.010. Unity\n\nStable ID: `T01.A02.S010`\n\n- `Line 1` The Law of One is held here as a unity principle: separation is useful for navigation, but not ultimate truth. (`Sec. 1.02.010.L001`; stable ID `T01.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 1.02.010.L002`; stable ID `T01.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 1.02.010.L003`; stable ID `T01.A02.S010.L003`)\n\n### Sec. 1.02.020. Service\n\nStable ID: `T01.A02.S020`\n\n- `Line 1` Service must not require self-abandonment; true service preserves dignity, consent, and source alignment. (`Sec. 1.02.020.L001`; stable ID `T01.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 1.02.020.L002`; stable ID `T01.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 1.02.020.L003`; stable ID `T01.A02.S020.L003`)\n\n### Sec. 1.02.030. Discernment\n\nStable ID: `T01.A02.S030`\n\n- `Line 1` Unity does not mean collapse of boundaries; discernment is how unity becomes safe in daily life. (`Sec. 1.02.030.L001`; stable ID `T01.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 1.02.030.L002`; stable ID `T01.A0  should return power to the reader rather than creating dependence. (`Sec. 1.03.030.L001`; stable ID `T01.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 1.03.030.L002`; stable ID `T01.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 1.03.030.L003`; stable ID `T01.A03.S030.L003`)","headings":[{"level":2,"text":"Article 3. EmpowerQNow","id":"article-3-empowerqnow"},{"level":3,"text":"Sec. 1.03.010. Empowerment","id":"sec-103010-empowerment"},{"level":3,"text":"Sec. 1.03.020. Voice","id":"sec-103020-voice"},{"level":3,"text":"Sec. 1.03.030. Transmission","id":"sec-103030-transmission"}],"order":13},{"id":"title_02_self_indexmd","name":"_index.md","relativePath":"title_02_self/_index.md","category":"TITLE 02 SELF","title":"_index","rawBody":"﻿---\r\ntags: folder\r\n---\r\n\r\n# Title 2. Inner World and Self\r\n\r\n- Title Cover\r\n- Article 1. Self_Recognition\r\n- Article 2. Inner Care\r\n- Article 3. Sacred Interior\r\n","headings":[],"order":0},{"id":"title_02_selftitle_02_selfmd","name":"title_02_self.md","relativePath":"title_02_self/title_02_self.md","category":"TITLE 02 SELF","title":"Title 2. Inner World and Self","summary":"The inner-life doctrine for selfhood, care, nervous-system truth, and spiritual/emotional steadiness.","status":"publish","rawBody":"# Title 2. Inner World and Self\n\n## Citation\n\n- Legal citation: `QiCode Title 2`\n- Article citation: `QiCode Title 2, Article #`\n- Section citation: `QiCode Sec. 2.##.###`\n- Stable ID alias: `QiCode T02.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 2.001.L001` This title is part of QiCode and should be read as personal life doctrine first. (stable ID `T02.R001.L001`)\n- `Rule 2.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T02.R001.L002`)\n- `Rule 2.001.L003` Exceptions should be named, reviewed, and ing fraud or contradiction. (`Sec. 3.01.020.L001`; stable ID `T03.A01.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.01.020.L002`; stable ID `T03.A01.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.01.020.L003`; stable ID `T03.A01.S020.L003`)\n\n### Sec. 3.01.030. Naming\n\nStable ID: `T03.A01.S030`\n\n- `Line 1` Names, labels, and aliases should clarify relationship and context without replacing the living person. (`Sec. 3.01.030.L001`; stable ID `T03.A01.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.01.030.L002`; stable ID `T03.A01.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.01.030.L003`; stable ID `T03.A01.S030.L003`)","headings":[{"level":2,"text":"Article 1. Identity","id":"article-1-identity"},{"level":3,"text":"Sec. 3.01.010. Self-Definition","id":"sec-301010-self-definition"},{"level":3,"text":"Sec. 3.01.020. Multiplicity","id":"sec-301020-multiplicity"},{"level":3,"text":"Sec. 3.01.030. Naming","id":"sec-301030-naming"}],"order":11},{"id":"title_03_identityarticle_02_integritymd","name":"article_02_integrity.md","relativePath":"title_03_identity/article_02_integrity.md","category":"TITLE 03 IDENTITY","title":"Article 2. Integrity","summary":"","status":"publish","rawBody":"## Article 2. Integrity\n\nStable ID: `T03.A02`\n\n### Sec. 3.02.010. Alignment\n\nStable ID: `T03.A02.S010`\n\n- `Line 1` Integrity means the visible life and the known inner truth are brought into closer alignment over time. (`Sec. 3.02.010.L001`; stable ID `T03.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.02.010.L002`; stable ID `T03.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.02.010.L003`; stable ID `T03.A02.S010.L003`)\n\n### Sec. 3.02.020. Record\n\nStable ID: `T03.A02.S020`\n\n- `Line 1` When identity is challenged or mischaracterized, records should preserve context rather than retaliatory distortion. (`Sec. 3.02.020.L001`; stable ID `T03.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.02.020.L002`; stable ID `T03.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.02.020.L003`; stable ID `T03.A02.S020.L003`)\n\n### Sec. 3.02.030. Correction\n\nStable ID: `T03.A02.S030`\n\n- `Line 1` Correction is lawful when it restores truth without unnecessary exposure. (`Sec. 3.02.030.L001`; stable ID `T03.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.02.030.L002`; stable ID `T03.A02.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.02.030.L003`; stable ID `T03.A02.S030.L003`)","headings":[{"level":2,"text":"Article 2. Integrity","id":"article-2-integrity"},{"level":3,"text":"Sec. 3.02.010. Alignment","id":"sec-302010-alignment"},{"level":3,"text":"Sec. 3.02.020. Record","id":"sec-302020-record"},{"level":3,"text":"Sec. 3.02.030. Correction","id":"sec-302030-correction"}],"order":12},{"id":"title_03_identityarticle_03_boundariesmd","name":"article_03_boundaries.md","relativePath":"title_03_identity/article_03_boundaries.md","category":"TITLE 03 IDENTITY","title":"Article 3. Boundaries","summary":"","status":"publish","rawBody":"## Article 3. Boundaries\n\nStable ID: `T03.A03`\n\n### Sec. 3.03.010. Boundary Validity\n\nStable ID: `T03.A03.S010`\n\n- `Line 1` A boundary is valid when it protects safety, truth, capacity, dignity, or consent. (`Sec. 3.03.010.L001`; stable ID `T03.A03.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.03.010.L002`; stable ID `T03.A03.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.03.010.L003`; stable ID `T03.A03.S010.L003`)\n\n### Sec. 3.03.020. Access\n\nStable ID: `T03.A03.S020`\n\n- `Line 1` Access to me, my labor, my attention, or my records is not automatically granted by proximity or urgency. (`Sec. 3.03.020.L001`; stable ID `T03.A03.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.03.020.L002`; stable ID `T03.A03.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.03.020.L003`; stable ID `T03.A03.S020.L003`)\n\n### Sec. 3.03.030. Enforcement\n\nStable ID: `T03.A03.S030`\n\n- `Line 1` A boundary without enforcement becomes a request; enforcement may be calm, documented, and proportionate. (`Sec. 3.03.030.L001`; stable ID `T03.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 3.03.030.L002`; stable ID `T03.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 3.03.030.L003`; stable ID `T03.A03.S030.L003`)","headings":[{"level":2,"text":"Article 3. Boundaries","id":"article-3-boundaries"},{"level":3,"text":"Sec. 3.03.010. Boundary Validity","id":"sec-303010-boundary-validity"},{"level":3,"text":"Sec. 3.03.020. Access","id":"sec-303020-access"},{"level":3,"text":"Sec. 3.03.030. Enforcement","id":"sec-303030-enforcement"}],"order":13},{"id":"title_04_mind_indexmd","name":"_index.md","relativePath":"title_04_mind/_index.md","category":"TITLE 04 MIND","title":"Title 4. Mind and Will","rawBody":"# Title 4. Mind and Will\n\n- Title Cover\n- Article 1. Attention\n- Article 2. Decision\n- Article 3. Will","headings":[{"level":1,"text":"Title 4. Mind and Will","id":"title-4-mind-and-will"}],"order":0},{"id":"title_04_mindtitle_04_mindmd","name":"title_04_mind.md","relativePath":"title_04_mind/title_04_mind.md","category":"TITLE 04 MIND","title":"Title 4. Mind and Will","summary":"The doctrine of attention, cognition, will, decisions, overload, and executive reality.","status":"publish","rawBody":"# Title 4. Mind and Will\n\n## Citation\n\n- Legal citation: `QiCode Title 4`\n- Article citation: `QiCode Title 4, Article #`\n- Section citation: `QiCode Sec. 4.##.###`\n- Stable ID alias: `QiCode T04.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 4.001.L001` This title is part of QiCode and should be read as personal life doctrine first. (stable ID `T04.R001.L001`)\n- `Rule 4.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T04.R001.L002`)\n- `Rule 4.001.L003` Exceptions should be named, reviewed, and linked to the record that justifies them. (stable ID `T04.R001.L003`)\n\n## Articles\n\n- Article 1. Attention\n- Article 2. Decision\n- Article 3. Will\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)","headings":[{"level":1,"text":"Title 4. Mind and Will","id":"title-4-mind-and-will"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_04_mindarticle_01_attentionmd","name":"article_01_attention.md","relativePath":"title_04_mind/article_01_attention.md","category":"TITLE 04 MIND","title":"Article 1. Attention","summary":"","status":"publish","rawBody":"## Article 1. Attention\n\nStable ID: `T04.A01`\n\n### Sec. 4.01.010. Capture Before Sort\n\nStable ID: `T04.A01.S010`\n\n- `Line 1` When attention is overloaded, capture first and sort later. (`Sec. 4.01.010.L001`; stable ID `T04.A01.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.01.010.L002`; stable ID `T04.A01.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.01.010.L003`; stable ID `T04.A01.S010.L003`)\n\n### Sec. 4.01.020. Focus\n\nStable ID: `T04.A01.S020`\n\n- `Line 1` Focus requires a named object, a realistic scope, and permission to stop. (`Sec. 4.01.020.L001`; stable ID `T04.A01.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.01.020.L002`; stable ID `T04.A01.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.01.020.L003`; stable ID `T04.A01.S020.L003`)\n\n### Sec. 4.01.030. Noise\n\nStable ID: `T04.A01.S030`\n\n- `Line 1` Noise should be reduced at the system level rather than treated only as personal discipline failure. (`Sec. 4.01.030.L001`; stable ID `T04.A01.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.01.030.L002`; stable ID `T04.A01.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.01.030.L003`; stable ID `T04.A01.S030.L003`)","headings":[{"level":2,"text":"Article 1. Attention","id":"article-1-attention"},{"level":3,"text":"Sec. 4.01.010. Capture Before Sort","id":"sec-401010-capture-before-sort"},{"level":3,"text":"Sec. 4.01.020. Focus","id":"sec-401020-focus"},{"level":3,"text":"Sec. 4.01.030. Noise","id":"sec-401030-noise"}],"order":11},{"id":"title_04_mindarticle_02_decisionmd","name":"article_02_decision.md","relativePath":"title_04_mind/article_02_decision.md","category":"TITLE 04 MIND","title":"Article 2. Decision","summary":"","status":"publish","rawBody":"## Article 2. Decision\n\nStable ID: `T04.A02`\n\n### Sec. 4.02.010. Decision Record\n\nStable ID: `T04.A02.S010`\n\n- `Line 1` Important decisions should preserve context, options, choice, and consequence. (`Sec. 4.02.010.L001`; stable ID `T04.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.02.010.L002`; stable ID `T04.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.02.010.L003`; stable ID `T04.A02.S010.L003`)\n\n### Sec. 4.02.020. Delay\n\nStable ID: `T04.A02.S020`\n\n- `Line 1` Delay may be lawful when information, safety, or capacity is missing. (`Sec. 4.02.020.L001`; stable ID `T04.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.02.020.L002`; stable ID `T04.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.02.020.L003`; stable ID `T04.A02.S020.L003`)\n\n### Sec. 4.02.030. Reversibility\n\nStable ID: `T04.A02.S030`\n\n- `Line 1` A decision should name whether it is reversible, difficult to reverse, or final. (`Sec. 4.02.030.L001`; stable ID `T04.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.02.030.L002`; stable ID `T04.A02.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.02.030.L003`; stable ID `T04.A02.S030.L003`)","headings":[{"level":2,"text":"Article 2. Decision","id":"article-2-decision"},{"level":3,"text":"Sec. 4.02.010. Decision Record","id":"sec-402010-decision-record"},{"level":3,"text":"Sec. 4.02.020. Delay","id":"sec-402020-delay"},{"level":3,"text":"Sec. 4.02.030. Reversibility","id":"sec-402030-reversibility"}],"order":12},{"id":"title_04_mindarticle_03_willmd","name":"article_03_will.md","relativePath":"title_04_mind/article_03_will.md","category":"TITLE 04 MIND","title":"Article 3. Will","summary":"","status":"publish","rawBody":"## Article 3. Will\n\nStable ID: `T04.A03`\n\n### Sec. 4.03.010. Agency\n\nStable ID: `T04.A03.S010`\n\n- `Line 1` Will is not brute force; will is aligned choice with enough structure to survive friction. (`Sec. 4.03.010.L001`; stable ID `T04.A03.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.03.010.L002`; stable ID `T04.A03.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.03.010.L003`; stable ID `T04.A03.S010.L003`)\n\n### Sec. 4.03.020. Commitment\n\nStable ID: `T04.A03.S020`\n\n- `Line 1` A commitment must be sized to actual capacity, not fantasy capacity. (`Sec. 4.03.020.L001`; stable ID `T04.A03.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.03.020.L002`; stable ID `T04.A03.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.03.020.L003`; stable ID `T04.A03.S020.L003`)\n\n### Sec. 4.03.030. Renegotiation\n\nStable ID: `T04.A03.S030`\n\n- `Line 1` Renegotiating a commitment is more truthful than silently collapsing under it. (`Sec. 4.03.030.L001`; stable ID `T04.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 4.03.030.L002`; stable ID `T04.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 4.03.030.L003`; stable ID `T04.A03.S030.L003`)","headings":[{"level":2,"text":"Article 3. Will","id":"article-3-will"},{"level":3,"text":"Sec. 4.03.010. Agency","id":"sec-403010-agency"},{"level":3,"text":"Sec. 4.03.020. Commitment","id":"sec-403020-commitment"},{"level":3,"text":"Sec. 4.03.030. Renegotiation","id":"sec-403030-renegotiation"}],"order":13},{"id":"title_05_work_indexmd","name":"_index.md","relativePath":"title_05_work/_index.md","category":"TITLE 05 WORK","title":"Title 5. Work, Creation, and Stewardship","rawBody":"# Title 5. Work, Creation, and Stewardship\n\n- Title Cover\n- Article 1. Work\n- Article 2. Creation\n- Article 3. Stewardship","headings":[{"level":1,"text":"Title 5. Work, Creation, and Stewardship","id":"title-5-work-creation-and-stewardship"}],"order":0},{"id":"title_05_worktitle_05_workmd","name":"title_05_work.md","relativePath":"title_05_work/title_05_work.md","category":"TITLE 05 WORK","title":"Title 5. Work, Creation, and Stewardship","summary":"The outer-work doctrine for projects, creation, service, craft, money, and stewardship.","status":"publish","rawBody":"# Title 5. Work, Creation, and Stewardship\n\n## Citation\n\n- Legal citation: `QiCode Title 5`\n- Article citation: `QiCode Title 5, Article #`\n- Section citation: `QiCode Sec. 5.##.###`\n- Stable ID alias: `QiCode T05.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 5.001.L001` This title is part of QiCode and should be read as personal life doctrine first. (stable ID `T05.R001.L001`)\n- `Rule 5.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T05.R001.L002`)\n- `Rule 5.001.L003` Exceptions should be named, reviewed, and linked to the record that justifies them. (stable ID `T05.R001.L003`)\n\n## Articles\n\n- Article 1. Work\n- Article 2. Creation\n- Article 3. Stewardship\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)","headings":[{"level":1,"text":"Title 5. Work, Creation, and Stewardship","id":"title-5-work-creation-and-stewardship"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_05_workarticle_01_workmd","name":"article_01_work.md","relativePath":"title_05_work/article_01_work.md","category":"TITLE 05 WORK","title":"Article 1. Work","summary":"","status":"publish","rawBody":"## Article 1. Work\n\nStable ID: `T05.A01`\n\n### Sec. 5.01.010. Project Home\n\nStable ID: `T05.A01.S010`\n\n- `Line 1` Every serious project should have one clear home, one purpose, and one visible next-action surface. (`Sec. 5.01.010.L001`; stable ID `T05.A01.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.01.010.L002`; stable ID `T05.A01.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.01.010.L003`; stable ID `T05.A01.S010.L003`)\n\n### Sec. 5.01.020. Labor Record\n\nStable ID: `T05.A01.S020`\n\n- `Line 1` Labor that costs time, income, health, or opportunity may be recorded without shame. (`Sec. 5.01.020.L001`; stable ID `T05.A01.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.01.020.L002`; stable ID `T05.A01.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.01.020.L003`; stable ID `T05.A01.S020.L003`)\n\n### Sec. 5.01.030. Completion\n\nStable ID: `T05.A01.S030`\n\n- `Line 1` Completion means the intended user can find and use the result without reconstructing hidden context. (`Sec. 5.01.030.L001`; stable ID `T05.A01.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.01.030.L002`; stable ID `T05.A01.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.01.030.L003`; stable ID `T05.A01.S030.L003`)","headings":[{"level":2,"text":"Article 1. Work","id":"article-1-work"},{"level":3,"text":"Sec. 5.01.010. Project Home","id":"sec-501010-project-home"},{"level":3,"text":"Sec. 5.01.020. Labor Record","id":"sec-501020-labor-record"},{"level":3,"text":"Sec. 5.01.030. Completion","id":"sec-501030-completion"}],"order":11},{"id":"title_05_workarticle_02_creationmd","name":"article_02_creation.md","relativePath":"title_05_work/article_02_creation.md","category":"TITLE 05 WORK","title":"Article 2. Creation","summary":"","status":"publish","rawBody":"## Article 2. Creation\n\nStable ID: `T05.A02`\n\n### Sec. 5.02.010. Useful First\n\nStable ID: `T05.A02.S010`\n\n- `Line 1` A created artifact should be useful before it is ornamental. (`Sec. 5.02.010.L001`; stable ID `T05.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.02.010.L002`; stable ID `T05.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.02.010.L003`; stable ID `T05.A02.S010.L003`)\n\n### Sec. 5.02.020. Voice\n\nStable ID: `T05.A02.S020`\n\n- `Line 1` Creative work may carry personal truth while still being edited for audience, safety, and form. (`Sec. 5.02.020.L001`; stable ID `T05.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.02.020.L002`; stable ID `T05.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.02.020.L003`; stable ID `T05.A02.S020.L003`)\n\n### Sec. 5.02.030. Output\n\nStable ID: `T05.A02.S030`\n\n- `Line 1` Outputs should name their audience, status, and intended next use. (`Sec. 5.02.030.L001`; stable ID `T05.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.02.030.L002`; stable ID `T05.A02.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.02.030.L003`; stable ID `T05.A02.S030.L003`)","headings":[{"level":2,"text":"Article 2. Creation","id":"article-2-creation"},{"level":3,"text":"Sec. 5.02.010. Useful First","id":"sec-502010-useful-first"},{"level":3,"text":"Sec. 5.02.020. Voice","id":"sec-502020-voice"},{"level":3,"text":"Sec. 5.02.030. Output","id":"sec-502030-output"}],"order":12},{"id":"title_05_workarticle_03_stewardshipmd","name":"article_03_stewardship.md","relativePath":"title_05_work/article_03_stewardship.md","category":"TITLE 05 WORK","title":"Article 3. Stewardship","summary":"","status":"publish","rawBody":"## Article 3. Stewardship\n\nStable ID: `T05.A03`\n\n### Sec. 5.03.010. Resources\n\nStable ID: `T05.A03.S010`\n\n- `Line 1` Money, tools, records, systems, and energy are stewardship objects and should be treated with care. (`Sec. 5.03.010.L001`; stable ID `T05.A03.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.03.010.L002`; stable ID `T05.A03.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.03.010.L003`; stable ID `T05.A03.S010.L003`)\n\n### Sec. 5.03.020. Sustainability\n\nStable ID: `T05.A03.S020`\n\n- `Line 1` Work that destroys the worker is not a stable operating model. (`Sec. 5.03.020.L001`; stable ID `T05.A03.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.03.020.L002`; stable ID `T05.A03.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.03.020.L003`; stable ID `T05.A03.S020.L003`)\n\n### Sec. 5.03.030. Value\n\nStable ID: `T05.A03.S030`\n\n- `Line 1` Value includes money, care, time, skill, meaning, continuity, and repair. (`Sec. 5.03.030.L001`; stable ID `T05.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 5.03.030.L002`; stable ID `T05.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 5.03.030.L003`; stable ID `T05.A03.S030.L003`)","headings":[{"level":2,"text":"Article 3. Stewardship","id":"article-3-stewardship"},{"level":3,"text":"Sec. 5.03.010. Resources","id":"sec-503010-resources"},{"level":3,"text":"Sec. 5.03.020. Sustainability","id":"sec-503020-sustainability"},{"level":3,"text":"Sec. 5.03.030. Value","id":"sec-503030-value"}],"order":13},{"id":"title_06_people_indexmd","name":"_index.md","relativePath":"title_06_people/_index.md","category":"TITLE 06 PEOPLE","title":"Title 6. People, Relations, and Exchange","rawBody":"# Title 6. People, Relations, and Exchange\n\n- Title Cover\n- Article 1. People\n- Article 2. Communication\n- Article 3. Exchange","headings":[{"level":1,"text":"Title 6. People, Relations, and Exchange","id":"title-6-people-relations-and-exchange"}],"order":0},{"id":"title_06_peopletitle_06_peoplemd","name":"title_06_people.md","relativePath":"title_06_people/title_06_people.md","category":"TITLE 06 PEOPLE","title":"Title 6. People, Relations, and Exchange","summary":"The relational doctrine for people, roles, communication, care, exchange, and obligation.","status":"publish","rawBody":"# Title 6. People, Relations, and Exchange\n\n## Citation\n\n- Legal citation: `QiCode Title 6`\n- Article citation: `QiCode Title 6, Article #`\n- Section citation: `QiCode Sec. 6.##.###`\n- Stable ID alias: `QiCode T06.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 6.001.L001` This title is part of QiCode and should be read as personal life doctrine first. (stable ID `T06.R001.L001`)\n- `Rule 6.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T06.R001.L002`)\n- `Rule 6.001.L003` Exceptions should be named, reviewed, and linked to the record that justifies them. (stable ID `T06.R001.L003`)\n\n## Articles\n\n- Article 1. People\n- Article 2. Communication\n- Article 3. Exchange\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)","headings":[{"level":1,"text":"Title 6. People, Relations, and Exchange","id":"title-6-people-relations-and-exchange"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_06_peoplearticle_01_peoplemd","name":"article_01_people.md","relativePath":"title_06_people/article_01_people.md","category":"TITLE 06 PEOPLE","title":"Article 1. People","summary":"","status":"publish","rawBody":"## Article 1. People\n\nStable ID: `T06.A01`\n\n### Sec. 6.01.010. Whole Person\n\nStable ID: `T06.A01.S010`\n\n- `Line 1` A person is never only a role, conflict, debt, diagnosis, or request. (`Sec. 6.01.010.L001`; stable ID `T06.A01.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.01.010.L002`; stable ID `T06.A01.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.01.010.L003`; stable ID `T06.A01.S010.L003`)\n\n### Sec. 6.01.020. Role Clarity\n\nStable ID: `T06.A01.S020`\n\n- `Line 1` Roles should clarify responsibility without swallowing identity. (`Sec. 6.01.020.L001`; stable ID `T06.A01.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.01.020.L002`; stable ID `T06.A01.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.01.020.L003`; stable ID `T06.A01.S020.L003`)\n\n### Sec. 6.01.030. Contact Boundary\n\nStable ID: `T06.A01.S030`\n\n- `Line 1` Contact information, relational context, and interpretation should be separated when possible. (`Sec. 6.01.030.L001`; stable ID `T06.A01.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.01.030.L002`; stable ID `T06.A01.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.01.030.L003`; stable ID `T06.A01.S030.L003`)","headings":[{"level":2,"text":"Article 1. People","id":"article-1-people"},{"level":3,"text":"Sec. 6.01.010. Whole Person","id":"sec-601010-whole-person"},{"level":3,"text":"Sec. 6.01.020. Role Clarity","id":"sec-601020-role-clarity"},{"level":3,"text":"Sec. 6.01.030. Contact Boundary","id":"sec-601030-contact-boundary"}],"order":11},{"id":"title_06_peoplearticle_02_communicationmd","name":"article_02_communication.md","relativePath":"title_06_people/article_02_communication.md","category":"TITLE 06 PEOPLE","title":"Article 2. Communication","summary":"","status":"publish","rawBody":"## Article 2. Communication\n\nStable ID: `T06.A02`\n\n### Sec. 6.02.010. Context\n\nStable ID: `T06.A02.S010`\n\n- `Line 1` Important communication should preserve sender, receiver, date, medium, and surrounding context. (`Sec. 6.02.010.L001`; stable ID `T06.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.02.010.L002`; stable ID `T06.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.02.010.L003`; stable ID `T06.A02.S010.L003`)\n\n### Sec. 6.02.020. Tone and Fact\n\nStable ID: `T06.A02.S020`\n\n- `Line 1` Tone may be described, but fact and interpretation should remain distinguishable. (`Sec. 6.02.020.L001`; stable ID `T06.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.02.020.L002`; stable ID `T06.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.02.020.L003`; stable ID `T06.A02.S020.L003`)\n\n### Sec. 6.02.030. Draft Status\n\nStable ID: `T06.A02.S030`\n\n- `Line 1` Draft replies remain drafts until deliberately sent. (`Sec. 6.02.030.L001`; stable ID `T06.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.02.030.L002`; stable ID `T06.A02.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.02.030.L003`; stable ID `T06.A02.S030.L003`)","headings":[{"level":2,"text":"Article 2. Communication","id":"article-2-communication"},{"level":3,"text":"Sec. 6.02.010. Context","id":"sec-602010-context"},{"level":3,"text":"Sec. 6.02.020. Tone and Fact","id":"sec-602020-tone-and-fact"},{"level":3,"text":"Sec. 6.02.030. Draft Status","id":"sec-602030-draft-status"}],"order":12},{"id":"title_06_peoplearticle_03_exchangemd","name":"article_03_exchange.md","relativePath":"title_06_people/article_03_exchange.md","category":"TITLE 06 PEOPLE","title":"Article 3. Exchange","summary":"","status":"publish","rawBody":"## Article 3. Exchange\n\nStable ID: `T06.A03`\n\n### Sec. 6.03.010. Reciprocity\n\nStable ID: `T06.A03.S010`\n\n- `Line 1` Exchange should be grounded in clarity, consent, and reality rather than guilt or panic. (`Sec. 6.03.010.L001`; stable ID `T06.A03.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.03.010.L002`; stable ID `T06.A03.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.03.010.L003`; stable ID `T06.A03.S010.L003`)\n\n### Sec. 6.03.020. Care Labor\n\nStable ID: `T06.A03.S020`\n\n- `Line 1` Care labor is real labor even when performed inside family systems. (`Sec. 6.03.020.L001`; stable ID `T06.A03.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.03.020.L002`; stable ID `T06.A03.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.03.020.L003`; stable ID `T06.A03.S020.L003`)\n\n### Sec. 6.03.030. Obligation\n\nStable ID: `T06.A03.S030`\n\n- `Line 1` Obligation should not be inferred from crisis pressure without review. (`Sec. 6.03.030.L001`; stable ID `T06.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 6.03.030.L002`; stable ID `T06.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 6.03.030.L003`; stable ID `T06.A03.S030.L003`)","headings":[{"level":2,"text":"Article 3. Exchange","id":"article-3-exchange"},{"level":3,"text":"Sec. 6.03.010. Reciprocity","id":"sec-603010-reciprocity"},{"level":3,"text":"Sec. 6.03.020. Care Labor","id":"sec-603020-care-labor"},{"level":3,"text":"Sec. 6.03.030. Obligation","id":"sec-603030-obligation"}],"order":13},{"id":"title_07_ethics_indexmd","name":"_index.md","relativePath":"title_07_ethics/_index.md","category":"TITLE 07 ETHICS","title":"Title 7. Ethics, Responsibility, and Disclosure","rawBody":"# Title 7. Ethics, Responsibility, and Disclosure\n\n- Title Cover\n- Article 1. Ethics\n- Article 2. Responsibility\n- Article 3. Disclosure","headings":[{"level":1,"text":"Title 7. Ethics, Responsibility, and Disclosure","id":"title-7-ethics-responsibility-and-disclosure"}],"order":0},{"id":"title_07_ethicstitle_07_ethicsmd","name":"title_07_ethics.md","relativePath":"title_07_ethics/title_07_ethics.md","category":"TITLE 07 ETHICS","title":"Title 7. Ethics, Responsibility, and Disclosure","summary":"The doctrine of care, harm reduction, privacy, fairness, responsibility, and selective disclosure.","status":"publish","rawBody":"# Title 7. Ethics, Responsibility, and Disclosure\n\n## Citation\n\n- Legal citation: `QiCode Title 7`\n- Article citation: `QiCode Title 7, Article #`\n- Section citation: `QiCode Sec. 7.##.###`\n- Stable ID alias: `QiCode T07.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 7.001.L001` This title is part of QiCode and should be read as personal life doctrine first. (stable ID `T07.R001.L001`)\n- `Rule 7.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T07.R001.L002`)\n- `Rule 7.001.L003` Exceptions should be named, reviewed, and linked to the record that justifies them. (stable ID `T07.R001.L003`)\n\n## Articles\n\n- Article 1. Ethics\n- Article 2. Responsibility\n- Article 3. Disclosure\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)","headings":[{"level":1,"text":"Title 7. Ethics, Responsibility, and Disclosure","id":"title-7-ethics-responsibility-and-disclosure"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_07_ethicsarticle_01_ethicsmd","name":"article_01_ethics.md","relativePath":"title_07_ethics/article_01_ethics.md","category":"TITLE 07 ETHICS","title":"Article 1. Ethics","summary":"","status":"publish","rawBody":"## Article 1. Ethics\n\nStable ID: `T07.A01`\n\n### Sec. 7.01.010. Dignity\n\nStable ID: `T07.A01.S010`\n\n- `Line 1` Records should preserve dignity even when documenting conflict, harm, or contradiction. (`Sec. 7.01.010.L001`; stable ID `T07.A01.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.01.010.L002`; stable ID `T07.A01.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.01.010.L003`; stable ID `T07.A01.S010.L003`)\n\n### Sec. 7.01.020. Minimum Necessary Disclosure\n\nStable ID: `T07.A01.S020`\n\n- `Line 1` Share only what is needed for the purpose, audience, and safety context. (`Sec. 7.01.020.L001`; stable ID `T07.A01.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.01.020.L002`; stable ID `T07.A01.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.01.020.L003`; stable ID `T07.A01.S020.L003`)\n\n### Sec. 7.01.030. Consent\n\nStable ID: `T07.A01.S030`\n\n- `Line 1` Consent and access boundaries should be explicit when material involves other people. (`Sec. 7.01.030.L001`; stable ID `T07.A01.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.01.030.L002`; stable ID `T07.A01.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.01.030.L003`; stable ID `T07.A01.S030.L003`)","headings":[{"level":2,"text":"Article 1. Ethics","id":"article-1-ethics"},{"level":3,"text":"Sec. 7.01.010. Dignity","id":"sec-701010-dignity"},{"level":3,"text":"Sec. 7.01.020. Minimum Necessary Disclosure","id":"sec-701020-minimum-necessary-disclosure"},{"level":3,"text":"Sec. 7.01.030. Consent","id":"sec-701030-consent"}],"order":11},{"id":"title_07_ethicsarticle_02_responsibilitymd","name":"article_02_responsibility.md","relativePath":"title_07_ethics/article_02_responsibility.md","category":"TITLE 07 ETHICS","title":"Article 2. Responsibility","summary":"","status":"publish","rawBody":"## Article 2. Responsibility\n\nStable ID: `T07.A02`\n\n### Sec. 7.02.010. Owned Action\n\nStable ID: `T07.A02.S010`\n\n- `Line 1` Responsibility begins with what I can truthfully own, repair, change, or refuse. (`Sec. 7.02.010.L001`; stable ID `T07.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.02.010.L002`; stable ID `T07.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.02.010.L003`; stable ID `T07.A02.S010.L003`)\n\n### Sec. 7.02.020. False Burden\n\nStable ID: `T07.A02.S020`\n\n- `Line 1` I am not responsible for carrying another person's entire system when consent, capacity, or safety is absent. (`Sec. 7.02.020.L001`; stable ID `T07.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.02.020.L002`; stable ID `T07.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.02.020.L003`; stable ID `T07.A02.S020.L003`)\n\n### Sec. 7.02.030. Evidence\n\nStable ID: `T07.A02.S030`\n\n- `Line 1` Responsibility claims should be grounded in evidence and context, not projection alone. (`Sec. 7.02.030.L001`; stable ID `T07.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.02.030.L002`; stable ID `T07.A02.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.02.030.L003`; stable ID `T07.A02.S030.L003`)","headings":[{"level":2,"text":"Article 2. Responsibility","id":"article-2-responsibility"},{"level":3,"text":"Sec. 7.02.010. Owned Action","id":"sec-702010-owned-action"},{"level":3,"text":"Sec. 7.02.020. False Burden","id":"sec-702020-false-burden"},{"level":3,"text":"Sec. 7.02.030. Evidence","id":"sec-702030-evidence"}],"order":12},{"id":"title_07_ethicsarticle_03_disclosuremd","name":"article_03_disclosure.md","relativePath":"title_07_ethics/article_03_disclosure.md","category":"TITLE 07 ETHICS","title":"Article 3. Disclosure","summary":"","status":"publish","rawBody":"## Article 3. Disclosure\n\nStable ID: `T07.A03`\n\n### Sec. 7.03.010. Sensitive Material\n\nStable ID: `T07.A03.S010`\n\n- `Line 1` Medical, legal, financial, and family-conflict material requires higher review before disclosure. (`Sec. 7.03.010.L001`; stable ID `T07.A03.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.03.010.L002`; stable ID `T07.A03.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.03.010.L003`; stable ID `T07.A03.S010.L003`)\n\n### Sec. 7.03.020. Audience\n\nStable ID: `T07.A03.S020`\n\n- `Line 1` A record may be true and still not appropriate for every audience. (`Sec. 7.03.020.L001`; stable ID `T07.A03.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.03.020.L002`; stable ID `T07.A03.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.03.020.L003`; stable ID `T07.A03.S020.L003`)\n\n### Sec. 7.03.030. Misuse Risk\n\nStable ID: `T07.A03.S030`\n\n- `Line 1` If a record can be easily misused, label it and route it carefully. (`Sec. 7.03.030.L001`; stable ID `T07.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 7.03.030.L002`; stable ID `T07.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 7.03.030.L003`; stable ID `T07.A03.S030.L003`)","headings":[{"level":2,"text":"Article 3. Disclosure","id":"article-3-disclosure"},{"level":3,"text":"Sec. 7.03.010. Sensitive Material","id":"sec-703010-sensitive-material"},{"level":3,"text":"Sec. 7.03.020. Audience","id":"sec-703020-audience"},{"level":3,"text":"Sec. 7.03.030. Misuse Risk","id":"sec-703030-misuse-risk"}],"order":13},{"id":"title_08_cycles_legacy_indexmd","name":"_index.md","relativePath":"title_08_cycles_legacy/_index.md","category":"TITLE 08 CYCLES LEGACY","title":"Title 8. Cycles, Closure, and Legacy","rawBody":"# Title 8. Cycles, Closure, and Legacy\n\n- Title Cover\n- Article 1. Cycles\n- Article 2. Closure\n- Article 3. Legacy","headings":[{"level":1,"text":"Title 8. Cycles, Closure, and Legacy","id":"title-8-cycles-closure-and-legacy"}],"order":0},{"id":"title_08_cycles_legacytitle_08_cycles_legacymd","name":"title_08_cycles_legacy.md","relativePath":"title_08_cycles_legacy/title_08_cycles_legacy.md","category":"TITLE 08 CYCLES LEGACY","title":"Title 8. Cycles, Closure, and Legacy","summary":"The doctrine of seasons, endings, repair cycles, archive, inheritance, and legacy design.","status":"publish","rawBody":"# Title 8. Cycles, Closure, and Legacy\n\n## Citation\n\n- Legal citation: `QiCode Title 8`\n- Article citation: `QiCode Title 8, Article #`\n- Section citation: `QiCode Sec. 8.##.###`\n- Stable ID alias: `QiCode T08.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 8.001.L001` This title is part of QiCode and should be read as personal life doctrine first. (stable ID `T08.R001.L001`)\n- `Rule 8.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T08.R001.L002`)\n- `Rule 8.001.L003` Exceptions should be named, reviewed, and linked to the record that justifies them. (stable ID `T08.R001.L003`)\n\n## Articles\n\n- Article 1. Cycles\n- Article 2. Closure\n- Article 3. Legacy\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)","headings":[{"level":1,"text":"Title 8. Cycles, Closure, and Legacy","id":"title-8-cycles-closure-and-legacy"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_08_cycles_legacyarticle_01_cyclesmd","name":"article_01_cycles.md","relativePath":"title_08_cycles_legacy/article_01_cycles.md","category":"TITLE 08 CYCLES LEGACY","title":"article_01_cycles","rawBody":"﻿---\nlayout: article\ntitle: Article 1. Cycles\nslug: qicode-title-08-article-01-cycles\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 08\nqicode_article: 1\nparent_title: Title 8. Cycles, Closure, and Legacy\ncanonical_ref: QiCode T08.A01\nsource_type: manual\n---\n\n## Article 1. Cycles\n\nStable ID: `T08.A01`\n\n### Sec. 8.01.010. Seasonality\n\nStable ID: `T08.A01.S010`\n\n- `Line 1` Life moves in seasons; a system should allow return, renewal, rest, and revision. (`Sec. 8.01.010.L001`; stable ID `T08.A01.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.01.010.L002`; stable ID `T08.A01.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.01.010.L003`; stable ID `T08.A01.S010.L003`)\n\n### Sec. 8.01.020. Review\n\nStable ID: `T08.A01.S020`\n\n- `Line 1` Active commitments, systems, and records need review before they become hidden burden. (`Sec. 8.01.020.L001`; stable ID `T08.A01.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.01.020.L002`; stable ID `T08.A01.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.01.020.L003`; stable ID `T08.A01.S020.L003`)\n\n### Sec. 8.01.030. Reset\n\nStable ID: `T08.A01.S030`\n\n- `Line 1` A reset is lawful when the current structure no longer serves truth, care, or action. (`Sec. 8.01.030.L001`; stable ID `T08.A01.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.01.030.L002`; stable ID `T08.A01.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.01.030.L003`; stable ID `T08.A01.S030.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 1. Cycles","id":"article-1-cycles"},{"level":3,"text":"Sec. 8.01.010. Seasonality","id":"sec-801010-seasonality"},{"level":3,"text":"Sec. 8.01.020. Review","id":"sec-801020-review"},{"level":3,"text":"Sec. 8.01.030. Reset","id":"sec-801030-reset"}],"order":11},{"id":"title_08_cycles_legacyarticle_02_closuremd","name":"article_02_closure.md","relativePath":"title_08_cycles_legacy/article_02_closure.md","category":"TITLE 08 CYCLES LEGACY","title":"article_02_closure","rawBody":"﻿---\nlayout: article\ntitle: Article 2. Closure\nslug: qicode-title-08-article-02-closure\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 08\nqicode_article: 2\nparent_title: Title 8. Cycles, Closure, and Legacy\ncanonical_ref: QiCode T08.A02\nsource_type: manual\n---\n\n## Article 2. Closure\n\nStable ID: `T08.A02`\n\n### Sec. 8.02.010. Completion Record\n\nStable ID: `T08.A02.S010`\n\n- `Line 1` Closed work should say what was done, where it lives, and what remains open. (`Sec. 8.02.010.L001`; stable ID `T08.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.02.010.L002`; stable ID `T08.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.02.010.L003`; stable ID `T08.A02.S010.L003`)\n\n### Sec. 8.02.020. Grief\n\nStable ID: `T08.A02.S020`\n\n- `Line 1` Closure may include grief without treating grief as failure. (`Sec. 8.02.020.L001`; stable ID `T08.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.02.020.L002`; stable ID `T08.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.02.020.L003`; stable ID `T08.A02.S020.L003`)\n\n### Sec. 8.02.030. Archive\n\nStable ID: `T08.A02.S030`\n\n- `Line 1` Archive material should remain findable without crowding the active field. (`Sec. 8.02.030.L001`; stable ID `T08.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.02.030.L002`; stable ID `T08.A02.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.02.030.L003`; stable ID `T08.A02.S030.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 2. Closure","id":"article-2-closure"},{"level":3,"text":"Sec. 8.02.010. Completion Record","id":"sec-802010-completion-record"},{"level":3,"text":"Sec. 8.02.020. Grief","id":"sec-802020-grief"},{"level":3,"text":"Sec. 8.02.030. Archive","id":"sec-802030-archive"}],"order":12},{"id":"title_08_cycles_legacyarticle_03_legacymd","name":"article_03_legacy.md","relativePath":"title_08_cycles_legacy/article_03_legacy.md","category":"TITLE 08 CYCLES LEGACY","title":"article_03_legacy","rawBody":"﻿---\nlayout: article\ntitle: Article 3. Legacy\nslug: qicode-title-08-article-03-legacy\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 08\nqicode_article: 3\nparent_title: Title 8. Cycles, Closure, and Legacy\ncanonical_ref: QiCode T08.A03\nsource_type: manual\n---\n\n## Article 3. Legacy\n\nStable ID: `T08.A03`\n\n### Sec. 8.03.010. Inheritance\n\nStable ID: `T08.A03.S010`\n\n- `Line 1` Legacy is what can be carried forward without needing the whole crisis to be relived. (`Sec. 8.03.010.L001`; stable ID `T08.A03.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.03.010.L002`; stable ID `T08.A03.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.03.010.L003`; stable ID `T08.A03.S010.L003`)\n\n### Sec. 8.03.020. Design\n\nStable ID: `T08.A03.S020`\n\n- `Line 1` Design should help the future self understand why the structure exists. (`Sec. 8.03.020.L001`; stable ID `T08.A03.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.03.020.L002`; stable ID `T08.A03.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.03.020.L003`; stable ID `T08.A03.S020.L003`)\n\n### Sec. 8.03.030. Transmission\n\nStable ID: `T08.A03.S030`\n\n- `Line 1` What is transmitted should preserve meaning, dignity, and usefulness. (`Sec. 8.03.030.L001`; stable ID `T08.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 8.03.030.L002`; stable ID `T08.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 8.03.030.L003`; stable ID `T08.A03.S030.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 3. Legacy","id":"article-3-legacy"},{"level":3,"text":"Sec. 8.03.010. Inheritance","id":"sec-803010-inheritance"},{"level":3,"text":"Sec. 8.03.020. Design","id":"sec-803020-design"},{"level":3,"text":"Sec. 8.03.030. Transmission","id":"sec-803030-transmission"}],"order":13},{"id":"title_09_qispark_bridge_indexmd","name":"_index.md","relativePath":"title_09_qispark_bridge/_index.md","category":"TITLE 09 QISPARK BRIDGE","title":"Title 9. QiSpark Technical Doctrine Bridge","rawBody":"# Title 9. QiSpark Technical Doctrine Bridge\n\n- Title Cover\n- Article 1. Bridge Rule\n- Article 2. QiSpark\n- Article 3. QiServer and Connected Systems\n- Article 4. Human Authority\n- Article 5. State and Verification\n- Article 6. Evidence, Memory, and AI\n- Article 7. Privacy and Object Identity","headings":[{"level":1,"text":"Title 9. QiSpark Technical Doctrine Bridge","id":"title-9-qispark-technical-doctrine-bridge"}],"order":0},{"id":"title_09_qispark_bridgetitle_09_qispark_bridgemd","name":"title_09_qispark_bridge.md","relativePath":"title_09_qispark_bridge/title_09_qispark_bridge.md","category":"TITLE 09 QISPARK BRIDGE","title":"Title 9. QiSpark Technical Doctrine Bridge","summary":"The bridge from personal doctrine into QiSpark technical/dev doctrine, QiServer, QiMemory, and QiConnect.","status":"publish","rawBody":"# Title 9. QiSpark Technical Doctrine Bridge\n\n## Citation\n\n- Legal citation: `QiCode Title 9`\n- Article citation: `QiCode Title 9, Article #`\n- Section citation: `QiCode Sec. 9.##.###`\n- Stable ID alias: `QiCode T09.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 9.001.L001` This title is the handoff from QiCode personal doctrine into QiSpark technical doctrine. (stable ID `T09.R001.L001`)\n- `Rule 9.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T09.R001.L002`)\n- `Rule 9.001.L003` Exceptions should be named, reviewed, and linked to the record that justifies them. (stable ID `T09.R001.L003`)\n\n## Articles\n\n- Article 1. Bridge Rule\n- Article 2. QiSpark\n- Article 3. QiServer and Connected Systems\n- Article 4. Human Authority\n- Article 5. State and Verification\n- Article 6. Evidence, Memory, and AI\n- Article 7. Privacy and Object Identity\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)","headings":[{"level":1,"text":"Title 9. QiSpark Technical Doctrine Bridge","id":"title-9-qispark-technical-doctrine-bridge"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_09_qispark_bridgearticle_01_bridge_rulemd","name":"article_01_bridge_rule.md","relativePath":"title_09_qispark_bridge/article_01_bridge_rule.md","category":"TITLE 09 QISPARK BRIDGE","title":"Article 1. Bridge Rule","summary":"","status":"publish","rawBody":"## Article 1. Bridge Rule\n\nStable ID: `T09.A01`\n\n### Sec. 9.01.010. Personal First\n\nStable ID: `T09.A01.S010`\n\n- `Line 1` QiSpark technical doctrine serves QiCode; it does not replace the personal life doctrine. (`Sec. 9.01.010.L001`; stable ID `T09.A01.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.01.010.L002`; stable ID `T09.A01.S010.L002`)\n- `Line 3` This bridge continues into current QiSpark architecture and implementation contracts. Former QiCode Titles 10–18 are preserved as superseded system-structure history and are not co-active personal doctrine. (`Sec. 9.01.010.L003`; stable ID `T09.A01.S010.L003`)\n\n### Sec. 9.01.020. Translation\n\nStable ID: `T09.A01.S020`\n\n- `Line 1` Technical systems translate doctrine into infrastructure, data, workflows, and tools. (`Sec. 9.01.020.L001`; stable ID `T09.A01.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.01.020.L002`; stable ID `T09.A01.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.01.020.L003`; stable ID `T09.A01.S020.L003`)\n\n### Sec. 9.01.030. Subordination\n\nStable ID: `T09.A01.S030`\n\n- `Line 1` When technical elegance conflicts with humane use, humane use governs unless safety requires otherwise. (`Sec. 9.01.030.L001`; stable ID `T09.A01.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.01.030.L002`; stable ID `T09.A01.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.01.030.L003`; stable ID `T09.A01.S030.L003`)","headings":[{"level":2,"text":"Article 1. Bridge Rule","id":"article-1-bridge-rule"},{"level":3,"text":"Sec. 9.01.010. Personal First","id":"sec-901010-personal-first"},{"level":3,"text":"Sec. 9.01.020. Translation","id":"sec-901020-translation"},{"level":3,"text":"Sec. 9.01.030. Subordination","id":"sec-901030-subordination"}],"order":11},{"id":"title_09_qispark_bridgearticle_02_qisparkmd","name":"article_02_qispark.md","relativePath":"title_09_qispark_bridge/article_02_qispark.md","category":"TITLE 09 QISPARK BRIDGE","title":"article_02_qispark","rawBody":"﻿---\nlayout: article\ntitle: Article 2. QiSpark\nslug: qicode-title-09-article-02-qispark\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 09\nqicode_article: 2\nparent_title: Title 9. QiSpark Technical Doctrine Bridge\ncanonical_ref: QiCode T09.A02\nsource_type: manual\n---\n\n## Article 2. QiSpark\n\nStable ID: `T09.A02`\n\n### Sec. 9.02.010. Dev Doctrine\n\nStable ID: `T09.A02.S010`\n\n- `Line 1` QiSpark holds the technical development doctrine: standards, structure, registries, schemas, decisions, and templates. (`Sec. 9.02.010.L001`; stable ID `T09.A02.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.02.010.L002`; stable ID `T09.A02.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.02.010.L003`; stable ID `T09.A02.S010.L003`)\n\n### Sec. 9.02.020. System Layers\n\nStable ID: `T09.A02.S020`\n\n- `Line 1` QiSpark feeds QiServer, QiVault, QiApps, and related implementation layers. (`Sec. 9.02.020.L001`; stable ID `T09.A02.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.02.020.L002`; stable ID `T09.A02.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.02.020.L003`; stable ID `T09.A02.S020.L003`)\n\n### Sec. 9.02.030. Engineering Record\n\nStable ID: `T09.A02.S030`\n\n- `Line 1` Technical decisions belong in ADRs, standards, registries, and system documentation. (`Sec. 9.02.030.L001`; stable ID `T09.A02.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.02.030.L002`; stable ID `T09.A02.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.02.030.L003`; stable ID `T09.A02.S030.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 2. QiSpark","id":"article-2-qispark"},{"level":3,"text":"Sec. 9.02.010. Dev Doctrine","id":"sec-902010-dev-doctrine"},{"level":3,"text":"Sec. 9.02.020. System Layers","id":"sec-902020-system-layers"},{"level":3,"text":"Sec. 9.02.030. Engineering Record","id":"sec-902030-engineering-record"}],"order":12},{"id":"title_09_qispark_bridgearticle_03_qiserver_and_connected_systemsmd","name":"article_03_qiserver_and_connected_systems.md","relativePath":"title_09_qispark_bridge/article_03_qiserver_and_connected_systems.md","category":"TITLE 09 QISPARK BRIDGE","title":"article_03_qiserver_and_connected_systems","rawBody":"﻿---\nlayout: article\ntitle: Article 3. QiServer and Connected Systems\nslug: qicode-title-09-article-03-qiserver-and-connected-systems\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 09\nqicode_article: 3\nparent_title: Title 9. QiSpark Technical Doctrine Bridge\ncanonical_ref: QiCode T09.A03\nsource_type: manual\n---\n\n## Article 3. QiServer and Connected Systems\n\nStable ID: `T09.A03`\n\n### Sec. 9.03.010. QiServer\n\nStable ID: `T09.A03.S010`\n\n- `Line 1` QiServer is the runtime and service layer for infrastructure, integrations, workers, and system operations. (`Sec. 9.03.010.L001`; stable ID `T09.A03.S010.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.03.010.L002`; stable ID `T09.A03.S010.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.03.010.L003`; stable ID `T09.A03.S010.L003`)\n\n### Sec. 9.03.020. QiMemory\n\nStable ID: `T09.A03.S020`\n\n- `Line 1` QiMemory handles ingestion, extraction, embeddings, retrieval, graphs, memory, and sync/backup concerns. (`Sec. 9.03.020.L001`; stable ID `T09.A03.S020.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.03.020.L002`; stable ID `T09.A03.S020.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.03.020.L003`; stable ID `T09.A03.S020.L003`)\n\n### Sec. 9.03.030. QiConnect\n\nStable ID: `T09.A03.S030`\n\n- `Line 1` QiConnect handles APIs, workflows, external integrations, and connection surfaces between systems. (`Sec. 9.03.030.L001`; stable ID `T09.A03.S030.L001`)\n- `Line 2` Apply this provision with truth, care, consent, and proportion. (`Sec. 9.03.030.L002`; stable ID `T09.A03.S030.L002`)\n- `Line 3` If the provision is used in a project, link back to the record, output, or decision that applies it. (`Sec. 9.03.030.L003`; stable ID `T09.A03.S030.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 3. QiServer and Connected Systems","id":"article-3-qiserver-and-connected-systems"},{"level":3,"text":"Sec. 9.03.010. QiServer","id":"sec-903010-qiserver"},{"level":3,"text":"Sec. 9.03.020. QiMemory","id":"sec-903020-qimemory"},{"level":3,"text":"Sec. 9.03.030. QiConnect","id":"sec-903030-qiconnect"}],"order":13},{"id":"title_09_qispark_bridgearticle_04_human_authoritymd","name":"article_04_human_authority.md","relativePath":"title_09_qispark_bridge/article_04_human_authority.md","category":"TITLE 09 QISPARK BRIDGE","title":"Article 4. Human Authority","status":"publish","rawBody":"## Article 4. Human Authority\n\n### Sec. 9.04.010. Final Human Authority\n\nStable ID: `QIC-09-04-001` (`T09.A04.S010`)\n\n- The person remains the final authority over consequential personal truth,\n  priorities, permissions, and action.\n- AI may propose, summarize, relate, explain, and draft; it may not silently\n  establish consequential personal truth.\n- Destructive or externally consequential action requires explicit authority\n  scoped to the action being taken.\n\n### Sec. 9.04.020. Proposals Are Not Decisions\n\nStable ID: `QIC-09-04-002` (`T09.A04.S020`)\n\n- AI-generated classifications, memories, relationships, and plans remain\n  proposals until the applicable deterministic rule or person approves them.\n- Absence of objection is not authority for a consequential mutation.","headings":[{"level":2,"text":"Article 4. Human Authority","id":"article-4-human-authority"},{"level":3,"text":"Sec. 9.04.010. Final Human Authority","id":"sec-904010-final-human-authority"},{"level":3,"text":"Sec. 9.04.020. Proposals Are Not Decisions","id":"sec-904020-proposals-are-not-decisions"}],"order":14},{"id":"title_09_qispark_bridgearticle_05_state_and_verificationmd","name":"article_05_state_and_verification.md","relativePath":"title_09_qispark_bridge/article_05_state_and_verification.md","category":"TITLE 09 QISPARK BRIDGE","title":"Article 5. State and Verification","status":"publish","rawBody":"## Article 5. State and Verification\n\n### Sec. 9.05.010. Meaningful Movement\n\nStable ID: `QIC-09-05-001` (`T09.A05.S010`)\n\nQi systems should help the person distinguish current state, desired state,\nthe gap between them, the next meaningful move, the verified result, and the\nlearning that follows. Collection without orientation or useful movement is\nincomplete system behavior.\n\n### Sec. 9.05.020. Visibility\n\nStable ID: `QIC-09-05-002` (`T09.A05.S020`)\n\nThe person must be able to determine what the system did, why it did it, which\nsource supported it, whether it succeeded, and what remains incomplete.","headings":[{"level":2,"text":"Article 5. State and Verification","id":"article-5-state-and-verification"},{"level":3,"text":"Sec. 9.05.010. Meaningful Movement","id":"sec-905010-meaningful-movement"},{"level":3,"text":"Sec. 9.05.020. Visibility","id":"sec-905020-visibility"}],"order":15},{"id":"title_09_qispark_bridgearticle_06_evidence_memory_and_aimd","name":"article_06_evidence_memory_and_ai.md","relativePath":"title_09_qispark_bridge/article_06_evidence_memory_and_ai.md","category":"TITLE 09 QISPARK BRIDGE","title":"Article 6. Evidence, Memory, and AI","status":"publish","rawBody":"## Article 6. Evidence, Memory, and AI\n\n### Sec. 9.06.010. Evidence and Provenance\n\nStable ID: `QIC-09-06-001` (`T09.A06.S010`)\n\n- Preserve original captures and evidence.\n- Store AI interpretation separately from its source.\n- Every consequential assertion must be traceable to a source.\n- Corrections supersede interpretations without destroying source history.\n\n### Sec. 9.06.020. Determinism Before AI\n\nStable ID: `QIC-09-06-002` (`T09.A06.S020`)\n\nDeterministic services govern persistence, calculations, permissions,\nrelationships, recurrence, export, restore, and external mutations. AI may\nassist extraction, recommendation, explanation, drafting, and proposed\nclassification, but it does not replace deterministic domain rules.\n\n### Sec. 9.06.030. Memory Governance\n\nStable ID: `QIC-09-06-003` (`T09.A06.S030`)\n\nQi systems distinguish working, episodic, semantic, and procedural memory.\nSemantic claims carry source, confidence, status, and validity. Sensitive or\nconsequential facts require approval. Contradictions are superseded explicitly,\nnot overwritten invisibly.","headings":[{"level":2,"text":"Article 6. Evidence, Memory, and AI","id":"article-6-evidence-memory-and-ai"},{"level":3,"text":"Sec. 9.06.010. Evidence and Provenance","id":"sec-906010-evidence-and-provenance"},{"level":3,"text":"Sec. 9.06.020. Determinism Before AI","id":"sec-906020-determinism-before-ai"},{"level":3,"text":"Sec. 9.06.030. Memory Governance","id":"sec-906030-memory-governance"}],"order":16},{"id":"title_09_qispark_bridgearticle_07_privacy_and_object_identitymd","name":"article_07_privacy_and_object_identity.md","relativePath":"title_09_qispark_bridge/article_07_privacy_and_object_identity.md","category":"TITLE 09 QISPARK BRIDGE","title":"Article 7. Privacy and Object Identity","status":"publish","rawBody":"## Article 7. Privacy and Object Identity\n\n### Sec. 9.07.010. Privacy and Separation\n\nStable ID: `QIC-09-07-001` (`T09.A07.S010`)\n\nPublic code and doctrine do not contain private user records. Private data\nremains owner-scoped. Secrets are separated from searchable records and\nordinary AI context. Exports and logs respect sensitivity classifications.\n\n### Sec. 9.07.020. Universal Object Identity\n\nStable ID: `QIC-09-07-002` (`T09.A07.S020`)\n\nA persistent thing receives a stable internal object identity independent of\nidentifiers issued by providers. Provider identifiers never replace canonical\ninternal identity.\n\n### Sec. 9.07.030. Object Evidence and Relationships\n\nStable ID: `QIC-09-07-003` (`T09.A07.S030`)\n\nObject identifiers, relationships, history, and source evidence remain\nseparate records linked by stable internal IDs. Human-readable titles may be\nresolved for display without replacing those IDs.\n\n### Sec. 9.07.040. Secret References\n\nStable ID: `QIC-09-07-004` (`T09.A07.S040`)\n\nSystems record where access material is protected, not the plaintext secret.\nSecret references and sensitive identifier values are excluded from ordinary\nAI context unless a specifically approved workflow requires them.","headings":[{"level":2,"text":"Article 7. Privacy and Object Identity","id":"article-7-privacy-and-object-identity"},{"level":3,"text":"Sec. 9.07.010. Privacy and Separation","id":"sec-907010-privacy-and-separation"},{"level":3,"text":"Sec. 9.07.020. Universal Object Identity","id":"sec-907020-universal-object-identity"},{"level":3,"text":"Sec. 9.07.030. Object Evidence and Relationships","id":"sec-907030-object-evidence-and-relationships"},{"level":3,"text":"Sec. 9.07.040. Secret References","id":"sec-907040-secret-references"}],"order":17},{"id":"title_10_qilabs_indexmd","name":"_index.md","relativePath":"title_10_qilabs/_index.md","category":"TITLE 10 QILABS","title":"Title 10. QiLabs â€” Index","summary":"Index for QiCode Title 10, QiLabs root operating environment.","status":"publish","rawBody":"# Title 10. QiLabs\r\n\r\n- Title Cover\r\n- Article 1. Root Authority\r\n- Article 2. System Map\r\n- Article 3. Source of Truth\r\n- Article 4. Root Folder Boundaries\r\n- Article 5. Naming and Numbering\r\n- Article 6. Lifecycle and Archive Rules","headings":[],"order":0},{"id":"title_10_qilabstitle_10_qilabsmd","name":"title_10_qilabs.md","relativePath":"title_10_qilabs/title_10_qilabs.md","category":"TITLE 10 QILABS","title":"Title 10. QiLabs","summary":"QiLabs is the root operating environment governing C:\\QiLabs and all top-level domains.","status":"publish","rawBody":"# Title 10. QiLabs\n\n## Citation\n\n- Legal citation: `QiCode Title 10`\n- Article citation: `QiCode Title 10, Article #`\n- Section citation: `QiCode Sec. 10.##.###`\n- Stable ID alias: `QiCode T10.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 10.001.L001` This title governs `C:\\QiLabs` as the full root operating environment. (stable ID `T10.R001.L001`)\n- `Rule 10.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T10.R001.L002`)\n- `Rule 10.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T10.R001.L003`)\n\n## Articles\n\n- Article 1. Root Authority\n- Article 2. System Map\n- Article 3. Source of Truth\n- Article 4. Root Folder Boundaries\n- Article 5. Naming and Numbering\n- Article 6. Lifecycle and Archive Rules\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)\n- [Migration Map](qilabs_title_migration_map.md)\n- [Title 11 â€” QiLabs Workspace](title_11_qilabs_workspace.md)","headings":[{"level":1,"text":"Title 10. QiLabs","id":"title-10-qilabs"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_10_qilabsarticle_01_root_authoritymd","name":"article_01_root_authority.md","relativePath":"title_10_qilabs/article_01_root_authority.md","category":"TITLE 10 QILABS","title":"article_01_root_authority","rawBody":"﻿---\nlayout: article\ntitle: Article 1. Root Authority\nslug: qicode-title-10-article-01-root-authority\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 10\nqicode_article: 1\nparent_title: Title 10. QiLabs\ncanonical_ref: QiCode T10.A01\nsource_type: manual\n---\n\n## Article 1. Root Authority\n\nStable ID: `T10.A01`\n\n### Sec. 10.01.010. Primary Function\n\nStable ID: `T10.A01.S010`\n\n- `Line 1` QiLabs is the root operating environment for all systems, applications, vaults, and projects under `C:\\QiLabs`. (`Sec. 10.01.010.L001`; stable ID `T10.A01.S010.L001`)\n- `Line 2` QiLabs must not be used as a dumping ground for unrelated material. (`Sec. 10.01.010.L002`; stable ID `T10.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 10.01.010.L003`; stable ID `T10.A01.S010.L003`)\n\n### Sec. 10.01.020. Root Folder Authority\n\nStable ID: `T10.A01.S020`\n\n- `Line 1` Every top-level folder under `C:\\QiLabs` must have one clear, documented purpose governed by a QiCode title. (`Sec. 10.01.020.L001`; stable ID `T10.A01.S020.L001`)\n- `Line 2` Root folders are governed domains, not casual categories. (`Sec. 10.01.020.L002`; stable ID `T10.A01.S020.L002`)\n- `Line 3` No new root folder may be created without a corresponding doctrine update in QiCode. (`Sec. 10.01.020.L003`; stable ID `T10.A01.S020.L003`)\n\n### Sec. 10.01.030. QiCode Coverage\n\nStable ID: `T10.A01.S030`\n\n- `Line 1` QiCode Titles 10â€“18 define the developer and system doctrine for the QiLabs root. (`Sec. 10.01.030.L001`; stable ID `T10.A01.S030.L001`)\n- `Line 2` Each title corresponds to exactly one top-level folder or system domain. (`Sec. 10.01.030.L002`; stable ID `T10.A01.S030.L002`)\n- `Line 3` Title 10 is the constitution for the entire root; all other titles are subordinate. (`Sec. 10.01.030.L003`; stable ID `T10.A01.S030.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 1. Root Authority","id":"article-1-root-authority"},{"level":3,"text":"Sec. 10.01.010. Primary Function","id":"sec-1001010-primary-function"},{"level":3,"text":"Sec. 10.01.020. Root Folder Authority","id":"sec-1001020-root-folder-authority"},{"level":3,"text":"Sec. 10.01.030. QiCode Coverage","id":"sec-1001030-qicode-coverage"}],"order":11},{"id":"title_10_qilabsarticle_02_system_mapmd","name":"article_02_system_map.md","relativePath":"title_10_qilabs/article_02_system_map.md","category":"TITLE 10 QILABS","title":"article_02_system_map","rawBody":"﻿---\nlayout: article\ntitle: Article 2. System Map\nslug: qicode-title-10-article-02-system-map\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 10\nqicode_article: 2\nparent_title: Title 10. QiLabs\ncanonical_ref: QiCode T10.A02\nsource_type: manual\n---\n\n## Article 2. System Map\n\nStable ID: `T10.A02`\n\n### Sec. 10.02.010. Current Root Domains\n\nStable ID: `T10.A02.S010`\n\n- `Line 1` `00_QiLabs.workspace` â€” workspace tools, templates, housekeeping, and manifests (Title 11). (`Sec. 10.02.010.L001`; stable ID `T10.A02.S010.L001`)\n- `Line 2` `10_QiSpark` â€” docs, landing, doctrine, and navigation layer (Title 12). (`Sec. 10.02.010.L002`; stable ID `T10.A02.S010.L002`)\n- `Line 3` `20_QiServer` â€” runtime, infrastructure, and services (Title 13). (`Sec. 10.02.010.L003`; stable ID `T10.A02.S010.L003`)\n\n### Sec. 10.02.020. Additional Root Domains\n\nStable ID: `T10.A02.S020`\n\n- `Line 1` `25_QiWorkers` â€” background jobs, APIs, sync, and automation workers (Title 14). (`Sec. 10.02.020.L001`; stable ID `T10.A02.S020.L001`)\n- `Line 2` `30_QiDrive` â€” file and markdown source-of-truth layer (Title 15). (`Sec. 10.02.020.L002`; stable ID `T10.A02.S020.L002`)\n- `Line 3` `40_QiVault` â€” markdown vault and local knowledge workspace (Title 16). (`Sec. 10.02.020.L003`; stable ID `T10.A02.S020.L003`)\n\n### Sec. 10.02.030. App and Site Domains\n\nStable ID: `T10.A02.S030`\n\n- `Line 1` `60_QiApps` â€” app projects and UI/tooling layers (Title 17). (`Sec. 10.02.030.L001`; stable ID `T10.A02.S030.L001`)\n- `Line 2` `70_QiSites` â€” public and static site output (Title 18). (`Sec. 10.02.030.L002`; stable ID `T10.A02.S030.L002`)\n- `Line 3` Any folder not listed above must be documented and assigned to a title before active use. (`Sec. 10.02.030.L003`; stable ID `T10.A02.S030.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 2. System Map","id":"article-2-system-map"},{"level":3,"text":"Sec. 10.02.010. Current Root Domains","id":"sec-1002010-current-root-domains"},{"level":3,"text":"Sec. 10.02.020. Additional Root Domains","id":"sec-1002020-additional-root-domains"},{"level":3,"text":"Sec. 10.02.030. App and Site Domains","id":"sec-1002030-app-and-site-domains"}],"order":12},{"id":"title_10_qilabsarticle_03_source_of_truthmd","name":"article_03_source_of_truth.md","relativePath":"title_10_qilabs/article_03_source_of_truth.md","category":"TITLE 10 QILABS","title":"article_03_source_of_truth","rawBody":"﻿---\nlayout: article\ntitle: Article 3. Source of Truth\nslug: qicode-title-10-article-03-source-of-truth\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 10\nqicode_article: 3\nparent_title: Title 10. QiLabs\ncanonical_ref: QiCode T10.A03\nsource_type: manual\n---\n\n## Article 3. Source of Truth\n\nStable ID: `T10.A03`\n\n### Sec. 10.03.010. Canonical Authority\n\nStable ID: `T10.A03.S010`\n\n- `Line 1` QiCode is the canonical governance layer; QiLabs root folders are its governed objects. (`Sec. 10.03.010.L001`; stable ID `T10.A03.S010.L001`)\n- `Line 2` When a folder's purpose is unclear, the QiCode title for that folder controls. (`Sec. 10.03.010.L002`; stable ID `T10.A03.S010.L002`)\n- `Line 3` Conflicts between folder usage and title doctrine must be resolved through a doctrine update, not a workaround. (`Sec. 10.03.010.L003`; stable ID `T10.A03.S010.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 3. Source of Truth","id":"article-3-source-of-truth"},{"level":3,"text":"Sec. 10.03.010. Canonical Authority","id":"sec-1003010-canonical-authority"}],"order":13},{"id":"title_10_qilabsarticle_04_root_folder_boundariesmd","name":"article_04_root_folder_boundaries.md","relativePath":"title_10_qilabs/article_04_root_folder_boundaries.md","category":"TITLE 10 QILABS","title":"article_04_root_folder_boundaries","rawBody":"﻿---\nlayout: article\ntitle: Article 4. Root Folder Boundaries\nslug: qicode-title-10-article-04-root-folder-boundaries\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 10\nqicode_article: 4\nparent_title: Title 10. QiLabs\ncanonical_ref: QiCode T10.A04\nsource_type: manual\n---\n\n## Article 4. Root Folder Boundaries\n\nStable ID: `T10.A04`\n\n### Sec. 10.04.010. Single Domain Rule\n\nStable ID: `T10.A04.S010`\n\n- `Line 1` Each root folder governs exactly one domain; cross-domain material must be placed in the owning domain. (`Sec. 10.04.010.L001`; stable ID `T10.A04.S010.L001`)\n- `Line 2` Shared dependencies must be documented with source mappings in the relevant title. (`Sec. 10.04.010.L002`; stable ID `T10.A04.S010.L002`)\n- `Line 3` Boundary disputes are resolved by reviewing the primary function in the domain's QiCode title. (`Sec. 10.04.010.L003`; stable ID `T10.A04.S010.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 4. Root Folder Boundaries","id":"article-4-root-folder-boundaries"},{"level":3,"text":"Sec. 10.04.010. Single Domain Rule","id":"sec-1004010-single-domain-rule"}],"order":14},{"id":"title_10_qilabsarticle_05_naming_and_numberingmd","name":"article_05_naming_and_numbering.md","relativePath":"title_10_qilabs/article_05_naming_and_numbering.md","category":"TITLE 10 QILABS","title":"article_05_naming_and_numbering","rawBody":"﻿---\nlayout: article\ntitle: Article 5. Naming and Numbering\nslug: qicode-title-10-article-05-naming-and-numbering\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 10\nqicode_article: 5\nparent_title: Title 10. QiLabs\ncanonical_ref: QiCode T10.A05\nsource_type: manual\n---\n\n## Article 5. Naming and Numbering\n\nStable ID: `T10.A05`\n\n### Sec. 10.05.010. Folder Numbering Convention\n\nStable ID: `T10.A05.S010`\n\n- `Line 1` Root folders use two-digit prefixes (`00_`, `10_`, `20_`, etc.) to define band and order. (`Sec. 10.05.010.L001`; stable ID `T10.A05.S010.L001`)\n- `Line 2` Band numbers are reserved; do not insert folders between bands without a QiCode update. (`Sec. 10.05.010.L002`; stable ID `T10.A05.S010.L002`)\n- `Line 3` Names within a folder must follow the parent
