 3` Experiments and abandoned apps must be moved to an archive subfolder, not deleted. (`Sec. 17.02.010.L003`; stable ID `T17.A02.S010.L003`)","headings":[{"level":2,"text":"Article 2. App Project Rules","id":"article-2-app-project-rules"},{"level":3,"text":"Sec. 17.02.010. Project Structure","id":"sec-1702010-project-structure"}],"order":12},{"id":"title_17_qiappsarticle_03_qilifemd","name":"article_03_qilife.md","relativePath":"title_17_qiapps/article_03_qilife.md","category":"TITLE 17 QIAPPS","title":"Article 3. QiLife","summary":"","status":"publish","rawBody":"## Article 3. QiLife\n\nStable ID: `T17.A03`\n\n### Sec. 17.03.010. QiLife Scope\n\nStable ID: `T17.A03.S010`\n\n- `Line 1` QiLife is the primary personal life operating system app; it lives in `60_QiApps/40_QiLife`. (`Sec. 17.03.010.L001`; stable ID `T17.A03.S010.L001`)\n- `Line 2` QiLife's data spine is Supabase; schema changes follow the migration policy in QiLife's title. (`Sec. 17.03.010.L002`; stable ID `T17.A03.S010.L002`)\n- `Line 3` QiLife UI/tools live in QiApps; QiLife source of truth for personal data is QiDrive/Supabase. (`Sec. 17.03.010.L003`; stable ID `T17.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. QiLife","id":"article-3-qilife"},{"level":3,"text":"Sec. 17.03.010. QiLife Scope","id":"sec-1703010-qilife-scope"}],"order":13},{"id":"title_17_qiappsarticle_04_qifinance_fireflymd","name":"article_04_qifinance_firefly.md","relativePath":"title_17_qiapps/article_04_qifinance_firefly.md","category":"TITLE 17 QIAPPS","title":"Article 4. QiFinance (Firefly)","summary":"","status":"publish","rawBody":"## Article 4. QiFinance (Firefly)\n\nStable ID: `T17.A04`\n\n### Sec. 17.04.010. QiFinance Scope\n\nStable ID: `T17.A04.S010`\n\n- `Line 1` QiFinance (Firefly) is the financial tracking and analysis app; it is documented in `60_QiApps/60_QiApps/firefly.md`. (`Sec. 17.04.010.L001`; stable ID `T17.A04.S010.L001`)\n- `Line 2` QiFinance operates on a single financial universe principle: one data model, no duplicate transaction sources. (`Sec. 17.04.010.L002`; stable ID `T17.A04.S010.L002`)\n- `Line 3` Financial data authority decisions must be documented in QiFinance ADRs. (`Sec. 17.04.010.L003`; stable ID `T17.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. QiFinance (Firefly)","id":"article-4-qifinance-firefly"},{"level":3,"text":"Sec. 17.04.010. QiFinance Scope","id":"sec-1704010-qifinance-scope"}],"order":14},{"id":"title_17_qiappsarticle_05_carelitemd","name":"article_05_carelite.md","relativePath":"title_17_qiapps/article_05_carelite.md","category":"TITLE 17 QIAPPS","title":"Article 5. CareLite","summary":"","status":"publish","rawBody":"## Article 5. CareLite\n\nStable ID: `T17.A05`\n\n### Sec. 17.05.010. CareLite Scope\n\nStable ID: `T17.A05.S010`\n\n- `Line 1` CareLite and related caregiving tools live in `60_QiApps/60_QiApps/10_CareLite`. (`Sec. 17.05.010.L001`; stable ID `T17.A05.S010.L001`)\n- `Line 2` Caregiving records and evidence are protected; the app may surface them but must not modify canonical records. (`Sec. 17.05.010.L002`; stable ID `T17.A05.S010.L002`)\n- `Line 3` Care record documentation lives in the vault under protected folders; it does not merge into app source. (`Sec. 17.05.010.L003`; stable ID `T17.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. CareLite","id":"article-5-carelite"},{"level":3,"text":"Sec. 17.05.010. CareLite Scope","id":"sec-1705010-carelite-scope"}],"order":15},{"id":"title_17_qiappsarticle_06_experimentsmd","name":"article_06_experiments.md","relativePath":"title_17_qiapps/article_06_experiments.md","category":"TITLE 17 QIAPPS","title":"Article 6. Experiments","summary":"","status":"publish","rawBody":"## Article 6. Experiments\n\nStable ID: `T17.A06`\n\n### Sec. 17.06.010. Experiment Policy\n\nStable ID: `T17.A06.S010`\n\n- `Line 1` Experimental apps and tooling live in `60_QiApps/69_QiTrials` or equivalent. (`Sec. 17.06.010.L001`; stable ID `T17.A06.S010.L001`)\n- `Line 2` Experiments must be clearly labeled with status, start date, and exit criteria. (`Sec. 17.06.010.L002`; stable ID `T17.A06.S010.L002`)\n- `Line 3` An experiment that moves to production must graduate to its own numbered subfolder with a product doctrine doc. (`Sec. 17.06.010.L003`; stable ID `T17.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Experiments","id":"article-6-experiments"},{"level":3,"text":"Sec. 17.06.010. Experiment Policy","id":"sec-1706010-experiment-policy"}],"order":16},{"id":"title_17_qiappsarticle_07_app_lifecyclemd","name":"article_07_app_lifecycle.md","relativePath":"title_17_qiapps/article_07_app_lifecycle.md","category":"TITLE 17 QIAPPS","title":"Article 7. App Lifecycle","summary":"","status":"publish","rawBody":"## Article 7. App Lifecycle\n\nStable ID: `T17.A07`\n\n### Sec. 17.07.010. Lifecycle States\n\nStable ID: `T17.A07.S010`\n\n- `Line 1` App lifecycle states are: `experimental`, `active`, `maintenance`, `deprecated`, `archived`. (`Sec. 17.07.010.L001`; stable ID `T17.A07.S010.L001`)\n- `Line 2` Status must be reflected in the app's `status` frontmatter field and its doctrine document. (`Sec. 17.07.010.L002`; stable ID `T17.A07.S010.L002`)\n- `Line 3` A deprecated app must document its successor and migration path before being archived. (`Sec. 17.07.010.L003`; stable ID `T17.A07.S010.L003`)","headings":[{"level":2,"text":"Article 7. App Lifecycle","id":"article-7-app-lifecycle"},{"level":3,"text":"Sec. 17.07.010. Lifecycle States","id":"sec-1707010-lifecycle-states"}],"order":17},{"id":"title_18_qisites_indexmd","name":"_index.md","relativePath":"title_18_qisites/_index.md","category":"TITLE 18 QISITES","title":"Title 18. QiSites â€” Index","summary":"Index for QiCode Title 18, QiSites.","status":"publish","rawBody":"# Title 18. QiSites\n\n- Title Cover\n- Article 1. QiSites Purpose\n- Article 2. Deployment\n- Article 3. Privacy and Sensitivity\n- Article 4. Site Inventory\n- Article 5. EmpowerQNow\n- Article 6. Build Artifacts\n- Article 7. Custom Domains","headings":[{"level":1,"text":"Title 18. QiSites","id":"title-18-qisites"}],"order":0},{"id":"title_18_qisitestitle_18_qisitesmd","name":"title_18_qisites.md","relativePath":"title_18_qisites/title_18_qisites.md","category":"TITLE 18 QISITES","title":"Title 18. QiSites","summary":"QiSites governs 70_QiSites â€” public and static site output targets for the QiLabs system.","status":"publish","rawBody":"# Title 18. QiSites\n\n## Citation\n\n- Legal citation: `QiCode Title 18`\n- Article citation: `QiCode Title 18, Article #`\n- Section citation: `QiCode Sec. 18.##.###`\n- Stable ID alias: `QiCode T18.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 18.001.L001` This title governs `70_QiSites` â€” public and static site output for QiLabs. (stable ID `T18.R001.L001`)\n- `Rule 18.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T18.R001.L002`)\n- `Rule 18.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T18.R001.L003`)\n\n## Articles\n\n- Article 1. QiSites Purpose\n- Article 2. Deployment\n- Article 3. Privacy and Sensitivity\n- Article 4. Site Inventory\n- Article 5. EmpowerQNow\n- Article 6. Build Artifacts\n- Article 7. Custom Domains\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Title 10 â€” QiLabs](title_10_qilabs.md)\n- [Title 12 â€” QiSpark](title_12_qispark.md)\n- [Migration Map](qilabs_title_migration_map.md)","headings":[{"level":1,"text":"Title 18. QiSites","id":"title-18-qisites"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_18_qisitesarticle_01_qisites_purposemd","name":"article_01_qisites_purpose.md","relativePath":"title_18_qisites/article_01_qisites_purpose.md","category":"TITLE 18 QISITES","title":"Article 1. QiSites Purpose","summary":"","status":"publish","rawBody":"## Article 1. QiSites Purpose\n\nStable ID: `T18.A01`\n\n### Sec. 18.01.010. Primary Function\n\nStable ID: `T18.A01.S010`\n\n- `Line 1` QiSites holds static and public site output: the deployable artifacts produced by QiSpark or QiApps builds. (`Sec. 18.01.010.L001`; stable ID `T18.A01.S010.L001`)\n- `Line 2` QiSites is output-only; it does not hold source material, vault content, or live databases. (`Sec. 18.01.010.L002`; stable ID `T18.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 18.01.010.L003`; stable ID `T18.A01.S010.L003`)\n\n### Sec. 18.01.020. Source and Output Distinction\n\nStable ID: `T18.A01.S020`\n\n- `Line 1` Source markdown for public sites lives in QiSpark (docs) or QiApps (landing); `70_QiSites` holds the build output only. (`Sec. 18.01.020.L001`; stable ID `T18.A01.S020.L001`)\n- `Line 2` Modifying built files directly inside `70_QiSites` is not permitted; changes must come from the source layer. (`Sec. 18.01.020.L002`; stable ID `T18.A01.S020.L002`)\n- `Line 3` Build outputs must be clearly separated from source files in `git` history. (`Sec. 18.01.020.L003`; stable ID `T18.A01.S020.L003`)","headings":[{"level":2,"text":"Article 1. QiSites Purpose","id":"article-1-qisites-purpose"},{"level":3,"text":"Sec. 18.01.010. Primary Function","id":"sec-1801010-primary-function"},{"level":3,"text":"Sec. 18.01.020. Source and Output Distinction","id":"sec-1801020-source-and-output-distinction"}],"order":11},{"id":"title_18_qisitesarticle_02_deploymentmd","name":"article_02_deployment.md","relativePath":"title_18_qisites/article_02_deployment.md","category":"TITLE 18 QISITES","title":"Article 2. Deployment","summary":"","status":"publish","rawBody":"## Article 2. Deployment\n\nStable ID: `T18.A02`\n\n### Sec. 18.02.010. Deployment Targets\n\nStable ID: `T18.A02.S010`\n\n- `Line 1` Sites in `70_QiSites` are deployed to Cloudflare Pages, GitHub Pages, or equivalent governed static hosting. (`Sec. 18.02.010.L001`; stable ID `T18.A02.S010.L001`)\n- `Line 2` Each site must have a documented deployment target, custom domain (if any), and CI/CD configuration. (`Sec. 18.02.010.L002`; stable ID `T18.A02.S010.L002`)\n- `Line 3` Deployment must be automated; manual uploads are not a governed deployment method. (`Sec. 18.02.010.L003`; stable ID `T18.A02.S010.L003`)","headings":[{"level":2,"text":"Article 2. Deployment","id":"article-2-deployment"},{"level":3,"text":"Sec. 18.02.010. Deployment Targets","id":"sec-1802010-deployment-targets"}],"order":12},{"id":"title_18_qisitesarticle_03_privacy_and_sensitivitymd","name":"article_03_privacy_and_sensitivity.md","relativePath":"title_18_qisites/article_03_privacy_and_sensitivity.md","category":"TITLE 18 QISITES","title":"Article 3. Privacy and Sensitivity","summary":"","status":"publish","rawBody":"## Article 3. Privacy and Sensitivity\n\nStable ID: `T18.A03`\n\n### Sec. 18.03.010. Public Boundary\n\nStable ID: `T18.A03.S010`\n\n- `Line 1` Only material explicitly approved for public publishing may enter `70_QiSites`. (`Sec. 18.03.010.L001`; stable ID `T18.A03.S010.L001`)\n- `Line 2` The build pipeline must enforce sensitivity filtering; `sensitivity: internal` or higher must not pass through. (`Sec. 18.03.010.L002`; stable ID `T18.A03.S010.L002`)\n- `Line 3` A published file must be traceable back to its source and its sensitivity review. (`Sec. 18.03.010.L003`; stable ID `T18.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. Privacy and Sensitivity","id":"article-3-privacy-and-sensitivity"},{"level":3,"text":"Sec. 18.03.010. Public Boundary","id":"sec-1803010-public-boundary"}],"order":13},{"id":"title_18_qisitesarticle_04_site_inventorymd","name":"article_04_site_inventory.md","relativePath":"title_18_qisites/article_04_site_inventory.md","category":"TITLE 18 QISITES","title":"Article 4. Site Inventory","summary":"","status":"publish","rawBody":"## Article 4. Site Inventory\n\nStable ID: `T18.A04`\n\n### Sec. 18.04.010. Site Registry\n\nStable ID: `T18.A04.S010`\n\n- `Line 1` A site registry document in `70_QiSites` must list all active public sites, their domains, and their source. (`Sec. 18.04.010.L001`; stable ID `T18.A04.S010.L001`)\n- `Line 2` Decommissioned sites must be documented in the registry with a retirement date and redirect policy. (`Sec. 18.04.010.L002`; stable ID `T18.A04.S010.L002`)\n- `Line 3` Sites with overlapping content must have a documented reason for the overlap or must be consolidated. (`Sec. 18.04.010.L003`; stable ID `T18.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. Site Inventory","id":"article-4-site-inventory"},{"level":3,"text":"Sec. 18.04.010. Site Registry","id":"sec-1804010-site-registry"}],"order":14},{"id":"title_18_qisitesarticle_05_empowerqnowmd","name":"article_05_empowerqnow.md","relativePath":"title_18_qisites/article_05_empowerqnow.md","category":"TITLE 18 QISITES","title":"Article 5. EmpowerQNow","summary":"","status":"publish","rawBody":"## Article 5. EmpowerQNow\n\nStable ID: `T18.A05`\n\n### Sec. 18.05.010. EmpowerQNow Site Governance\n\nStable ID: `T18.A05.S010`\n\n- `Line 1` EmpowerQNow public site output lives in `70_QiSites/empowerqnow` and is governed by this title. (`Sec. 18.05.010.L001`; stable ID `T18.A05.S010.L001`)\n- `Line 2` EmpowerQNow content follows the public boundary policy in Sec. 18.03.010. (`Sec. 18.05.010.L002`; stable ID `T18.A05.S010.L002`)\n- `Line 3` Teaching and empowerment content must return power to the reader in alignment with QiCode T01.A03. (`Sec. 18.05.010.L003`; stable ID `T18.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. EmpowerQNow","id":"article-5-empowerqnow"},{"level":3,"text":"Sec. 18.05.010. EmpowerQNow Site Governance","id":"sec-1805010-empowerqnow-site-governance"}],"order":15},{"id":"title_18_qisitesarticle_06_build_artifactsmd","name":"article_06_build_artifacts.md","relativePath":"title_18_qisites/article_06_build_artifacts.md","category":"TITLE 18 QISITES","title":"Article 6. Build Artifacts","summary":"","status":"publish","rawBody":"## Article 6. Build Artifacts\n\nStable ID: `T18.A06`\n\n### Sec. 18.06.010. Artifact Policy\n\nStable ID: `T18.A06.S010`\n\n- `Line 1` Build artifacts (HTML, CSS, JS bundles) in `70_QiSites` are treated as derived content and may be regenerated. (`Sec. 18.06.010.L001`; stable ID `T18.A06.S010.L001`)\n- `Line 2` Do not commit sensitive data, API keys, or personal records inside build artifacts. (`Sec. 18.06.010.L002`; stable ID `T18.A06.S010.L002`)\n- `Line 3` If artifact content diverges from source, the source governs; rebuild, do not patch the artifact. (`Sec. 18.06.010.L003`; stable ID `T18.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Build Artifacts","id":"article-6-build-artifacts"},{"level":3,"text":"Sec. 18.06.010. Artifact Policy","id":"sec-1806010-artifact-policy"}],"order":16},{"id":"title_18_qisitesarticle_07_custom_domainsmd","name":"article_07_custom_domains.md","relativePath":"title_18_qisites/article_07_custom_domains.md","category":"TITLE 18 QISITES","title":"Article 7. Custom Domains","summary":"","status":"publish","rawBody":"## Article 7. Custom Domains\n\nStable ID: `T18.A07`\n\n### Sec. 18.07.010. Domain Policy\n\nStable ID: `T18.A07.S010`\n\n- `Line 1` Custom domains for QiSites must be registered in the QiSpark domain registry. (`Sec. 18.07.010.L001`; stable ID `T18.A07.S010.L001`)\n- `Line 2` DNS changes must be documented before they are applied. (`Sec. 18.07.010.L002`; stable ID `T18.A07.S010.L002`)\n- `Line 3` Expired or abandoned domains must be retired from the site registry and from active DNS. (`Sec. 18.07.010.L003`; stable ID `T18.A07.S010.L003`)","headings":[{"level":2,"text":"Article 7. Custom Domains","id":"article-7-custom-domains"},{"level":3,"text":"Sec. 18.07.010. Domain Policy","id":"sec-1807010-domain-policy"}],"order":17},{"id":"conformancecontractschemayaml","name":"contract.schema.yaml","relativePath":"conformance/contract.schema.yaml","category":"CONFORMANCE & PROVISIONS","title":"contract.schema","rawBody":"{\n  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n  \"title\": \"QiCode system conformance\",\n  \"type\": \"object\",\n  \"required\": [\"system_id\", \"conformance\"],\n  \"properties\": {\n    \"system_id\": { \"type\": \"string\", \"minLength\": 1 },\n    \"conformance\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\": \"object\",\n        \"required\": [\"system_id\", \"provision_id\", \"status\", \"evidence\", \"verified_at\", \"verified_by\", \"notes\"],\n        \"properties\": {\n          \"system_id\": { \"type\": \"string\" },\n          \"provision_id\": { \"type\": \"string\", \"pattern\": \"^QIC-[0-9]{2}-[0-9]{2}-[0-9]{3}$\" },\n          \"status\": { \"enum\": [\"aligned\", \"partial\", \"missing\", \"superseded\", \"deferred\", \"not_applicable\", \"unverified\"] },\n          \"evidence\": { \"type\": \"array\" },\n          \"verified_at\": { \"type\": [\"string\", \"null\"] },\n          \"verified_by\": { \"type\": [\"string\", \"null\"] },\n          \"notes\": { \"type\": \"string\" }\n        }\n      }\n    }\n  }\n}\n","headings":[],"order":100},{"id":"conformanceprovisionsyaml","name":"provisions.yaml","relativePath":"conformance/provisions.yaml","category":"CONFORMANCE & PROVISIONS","title":"provisions","rawBody":"{\n  \"protected_id_version\": 1,\n  \"provisions\": [\n    { \"id\": \"QIC-09-04-001\", \"citation\": \"QiCode Sec. 9.04.010\", \"status\": \"active\", \"contradiction_group\": \"human-final-authority\" },\n    { \"id\": \"QIC-09-04-002\", \"citation\": \"QiCode Sec. 9.04.020\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-05-001\", \"citation\": \"QiCode Sec. 9.05.010\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-05-002\", \"citation\": \"QiCode Sec. 9.05.020\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-06-001\", \"citation\": \"QiCode Sec. 9.06.010\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-06-002\", \"citation\": \"QiCode Sec. 9.06.020\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-06-003\", \"citation\": \"QiCode Sec. 9.06.030\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-07-001\", \"citation\": \"QiCode Sec. 9.07.010\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-07-002\", \"citation\": \"QiCode Sec. 9.07.020\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-07-003\", \"citation\": \"QiCode Sec. 9.07.030\", \"status\": \"active\" },\n    { \"id\": \"QIC-09-07-004\", \"citation\": \"QiCode Sec. 9.07.040\", \"status\": \"active\" },\n    { \"id\": \"QIC-10-01-001\", \"citation\": \"Historical QiCode Title 10\", \"status\": \"superseded\", \"contradiction_group\": \"human-final-authority\" }\n  ]\n}\n","headings":[],"order":100},{"id":"conformancereadmemd","name":"README.md","relativePath":"conformance/README.md","category":"CONFORMANCE & PROVISIONS","title":"QiCode Conformance","rawBody":"# QiCode Conformance\n\nQiCode doctrine is stable. Application conformance is recorded separately so\nimplementation status can change without rewriting doctrine.\n\nEach system declares one row per provision. `aligned` requires evidence.\nRepository evidence uses paths relative to the repository being verified.\nPartial, missing, deferred, and unverified rows explain the gap in `notes`.\n\nRun QiLife validation from its repository:\n\n```powershell\nnode scripts/validate-qicode-conformance.mjs\n```\n\nThe validator rejects unknown or superseded provisions, invalid statuses,\nduplicate rows, evidence-free alignment, missing repository paths, and\ncontradictory active provisions.\n","headings":[{"level":1,"text":"QiCode Conformance","id":"qicode-conformance"}],"order":100},{"id":"conformancesystemsqifiyaml","name":"qifi.yaml","relativePath":"conformance/systems/qifi.yaml","category":"CONFORMANCE & PROVISIONS","title":"qifi","rawBody":"{\n  \"system_id\": \"qifi\",\n  \"conformance\": [\n    { \"system_id\": \"qifi\", \"provision_id\": \"QIC-09-04-001\", \"status\": \"unverified\", \"evidence\": [], \"verified_at\": null, \"verified_by\": null, \"notes\": \"QiFi requires a separate repository evidence review.\" }\n  ]\n}\n","headings":[],"order":100},{"id":"conformancesystemsqilifeyaml","name":"qilife.yaml","relativePath":"conformance/systems/qilife.yaml","category":"CONFORMANCE & PROVISIONS","title":"qilife","rawBody":"{\n  \"system_id\": \"qilife\",\n  \"conformance\": [\n    { \"system_id\": \"qilife\", \"provision_id\": \"QIC-09-04-001\", \"status\": \"partial\", \"evidence\": [{ \"type\": \"architecture_document\", \"value\": \"docs/ARCHITECTURE.md\" }], \"verified_at\": \"2026-07-29\", \"verified_by\": \"codex\", \"notes\": \"Deterministic persistence exists; consequential AI workflows remain deferred.\" },\n    { \"system_id\": \"qilife\", \"provision_id\": \"QIC-09-05-001\", \"status\": \"partial\", \"evidence\": [{ \"type\": \"repository_path\", \"value\": \"src/modules/today/services/todayProjection.ts\" }], \"verified_at\": \"2026-07-29\", \"verified_by\": \"codex\", \"notes\": \"Today provides steering projections; verified-result learning loops remain partial.\" },\n    { \"system_id\": \"qilife\", \"provision_id\": \"QIC-09-06-001\", \"status\": \"aligned\", \"evidence\": [{ \"type\": \"repository_path\", \"value\": \"src/modules/journal/services/journalRepository.ts\" }, { \"type\": \"test_path\", \"value\": \"src/features/qilife/reliability/recoveryService.test.ts\" }], \"verified_at\": \"2026-07-29\", \"verified_by\": \"codex\", \"notes\": \"Raw capture and recovery history remain separate from summaries.\" },\n    { \"system_id\": \"qilife\", \"provision_id\": \"QIC-09-06-002\", \"status\": \"aligned\", \"evidence\": [{ \"type\": \"repository_path\", \"value\": \"src/features/qilife/services/qilifeStore.ts\" }, { \"type\": \"architecture_document\", \"value\": \"docs/architecture/DATA_RECOVERY.md\" }], \"verified_at\": \"2026-07-29\", \"verified_by\": \"codex\", \"notes\": \"Persistence, owner scope, relationships, export, and restore are deterministic.\" },\n    { \"system_id\": \"qilife\", \"provision_id\": \"QIC-09-07-001\", \"status\": \"aligned\", \"evidence\": [{ \"type\": \"migration\", \"value\": \"supabase/migrations/0002_qilife_auth_rls.sql\" }], \"verified_at\": \"2026-07-29\", \"verified_by\": \"codex\", \"notes\": \"Shared records are owner scoped.\" },\n    { \"system_id\": \"qilife\", \"provision_id\": \"QIC-09-07-002\", \"status\": \"deferred\", \"evidence\": [], \"verified_at\": \"2026-07-29\", \"verified_by\": \"codex\", \"notes\": \"Universal Object Registry implementation is the active QiLife milestone.\" }\n  ]\n}\n","headings":[],"order":100},{"id":"conformancesystemsqisparkyaml","name":"qispark.yaml","relativePath":"conformance/systems/qispark.yaml","category":"CONFORMANCE & PROVISIONS","title":"qispark","rawBody":"{\n  \"system_id\": \"qispark\",\n  \"conformance\": [\n    { \"system_id\": \"qispark\", \"provision_id\": \"QIC-09-04-001\", \"status\": \"unverified\", \"evidence\": [], \"verified_at\": null, \"verified_by\": null, \"notes\": \"QiSpark requires a separate source and deployment evidence review.\" }\n  ]\n}\n","headings":[],"order":100},{"id":"reference_indexmd","name":"_index.md","relativePath":"reference/_index.md","category":"REFERENCE & GUIDES","title":"_index","rawBody":"```folder-index-content\n```","headings":[],"order":0},{"id":"referencecitation_guidemd","name":"citation_guide.md","relativePath":"reference/citation_guide.md","category":"REFERENCE & GUIDES","title":"QiCode Citation Guide","summary":"Reference syntax for citing QiCode personal-doctrine provisions.","status":"publish","rawBody":"# QiCode Citation Guide\n\n## Legal Citation First\n\nUse the plain legal-style citation first. Use the compact ID only when exact machine-stable reference is helpful.\n\n## Hierarchy\n\n- `Title #` means the major division of the doctrine.\n- `Article #` means a subdivision inside a title.\n- `Sec. #.##.###` means a section.\n- `Line #` means a citeable rule line inside a section.\n\n## Examples\n\n- `QiCode Title 1` cites Title 1, My Truth and Source.\n- `QiCode Title 1, Article 2` cites the Law of One article.\n- `QiCode Sec. 3.03.010` cites Title 3, Article 3, Section 010: Boundary Validity.\n- `QiCode Sec. 9.03.020, Line 1` cites the QiMemory bridge rule.\n\n## Stable ID Aliases\n\n- `QiCode T01` is the stable ID alias for `QiCode Title 1`.\n- `QiCode T01.A02` is the stable ID alias for `QiCode Title 1, Article 2`.\n- `QiCode T03.A03.S010` is the stable ID alias for `QiCode Sec. 3.03.010`.\n- `QiCode T09.A03.S020.L001` is the stable ID alias for `QiCode Sec. 9.03.020, Line 1`.\n\n## Style Rules\n\n- Put legal-style citations before stable IDs.\n- Keep section numbers stable once cited.\n- Add new sections in increments of 10, such as `Sec. 1.01.010`, `Sec. 1.01.020`, and `Sec. 1.01.030`.\n- Treat `Title 1` through `Title 8` as personal doctrine and `Title 9` as the bridge into QiSpark technical doctrine.","headings":[{"level":1,"text":"QiCode Citation Guide","id":"qicode-citation-guide"},{"level":2,"text":"Legal Citation First","id":"legal-citation-first"},{"level":2,"text":"Hierarchy","id":"hierarchy"},{"level":2,"text":"Examples","id":"examples"},{"level":2,"text":"Stable ID Aliases","id":"stable-id-aliases"},{"level":2,"text":"Style Rules","id":"style-rules"}],"order":100},{"id":"referencecore_overviewmd","name":"core_overview.md","relativePath":"reference/core_overview.md","category":"REFERENCE & GUIDES","title":"QiCode Core Overview","summary":"Overview of QiCode as personal life doctrine with a technical bridge into QiSpark.","status":"publish","rawBody":"# QiCode Core Overview\n\nQiCode is the personal life doctrine. It is written in a legal-code style so it can be cited, extended, and applied without losing its center.\n\n## Doctrine Layers\n\n1. `Title 1` establishes My Truth and Source: Law of One, EmpowerQNow, voice, and source alignment.\n2. `Title 2` through `Title 4` govern the inner world: self, identity, mind, will, boundaries, and agency.\n3. `Title 5` through `Title 7` govern the outer world: work, creation, people, exchange, ethics, responsibility, and disclosure.\n4. `Title 8` governs cycles, closure, archive, and legacy.\n5. `Title 9` bridges into QiSpark technical doctrine.\n\n## Technical Handoff\n\nQiSpark is the technical/dev doctrine that implements and supports QiCode. QiSpark feeds QiServer, QiMemory, QiConnect, QiVault, and QiApps.\n\n## Active Surfaces\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Citation Guide](citation_guide.md)\n- [QiSpark System](../../10_QiSpark/_index.md)\n- [QiServer](../../10_QiSpark/20_QiServer/_index.md)\n- [QiMemory](../../10_QiSpark/30_QiMemory/_index.md)\n- [QiConnect](../../10_QiSpark/50_QiConnect/_index.md)","headings":[{"level":1,"text":"QiCode Core Overview","id":"qicode-core-overview"},{"level":2,"text":"Doctrine Layers","id":"doctrine-layers"},{"level":2,"text":"Technical Handoff","id":"technical-handoff"},{"level":2,"text":"Active Surfaces","id":"active-surfaces"}],"order":100},{"id":"referenceqilabs_title_migration_mapmd","name":"qilabs_title_migration_map.md","relativePath":"reference/qilabs_title_migration_map.md","category":"REFERENCE & GUIDES","title":"QiLabs Title Migration Map","summary":"Maps legacy 50_QiLabs source material to canonical QiCode Titles 10–18.","status":"publish","rawBody":"# QiLabs Title Migration Map\n\n## Migration Metadata\n\n- **Legacy Source:** `40_QiVault/50_QiLabs`\n- **Target Structure:** QiCode Titles 10–18\n- **Migration Date:** 2026-07-21\n- **Type:** Controlled doctrine migration — source is preserved, not deleted or renamed\n\n## Mapping Table\n\n| Legacy Area | New QiCode Title | Notes |\n|---|---|---|\n| `50_QiLabs` root | Title 10 — QiLabs | Root operating environment constitution |\n| `50_QiLabs/00_QiLabs.workspace` | Title 11 — QiLabs Workspace | Workspace/tools/templates/housekeeping |\n| `50_QiLabs/10_Qispark` | Title 12 — QiSpark | Docs/site/landing/doctrine layer |\n| `50_QiLabs/20_QiServer` | Title 13 — QiServer | Runtime/infrastructure/services |\n| *(no legacy mirror)* | Title 14 — QiWorkers | APIs/workers/automation — written from doctrine spec |\n| `50_QiLabs/30_QiDrive` (stub only) | Title 15 — QiDrive | Drive/files/evidence source of truth |\n| `40_QiVault` root | Title 16 — QiVault | Markdown vault / local knowledge workspace |\n| `50_QiLabs/60_QiApps` | Title 17 — QiApps | Apps/projects/UI layers |\n| `50_QiLabs/70_QiSites` | Title 18 — QiSites | Static/public site output |\n\n## Out-of-Scope Legacy Sections\n\nThe following legacy sections exist in `50_QiLabs` but are **not** mapped to Titles 10–18:\n\n| Legacy Folder | Status | Notes |\n|---|---|---|\n| `50_QiLabs/30_QiDrive` stub | Not in scope | Title 15 written from doctrine spec |\n| `50_QiConnect` (appears in sub-docs) | Not in scope | QiConnect is not a standalone title in T10–18 |\n| `30_QiMemory` (legacy sub-section) | Not in scope | QiMemory content lives under QiServer/QiWorkers doctrine |\n| `50_QiLabs/90_ARCH` | Not in scope | Legacy ARCH notes — reference only |\n\n## Doctrine Updates\n\n- **QiAccess** is retired as a separate module. It does not receive a title.\n- **QiDNA** is not a standalone module. It is doctrine content inside QiSpark / QiCode docs.\n- **QiSpark** now governs docs, landing, navigation, and doctrine — not just a dev layer.\n- **QiDrive** is the file and markdown source-of-truth layer (Google Drive primary runtime).\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Legacy 50_QiLabs Source](qilabs_legacy_50_qilabs.md)","headings":[{"level":1,"text":"QiLabs Title Migration Map","id":"qilabs-title-migration-map"},{"level":2,"text":"Migration Metadata","id":"migration-metadata"},{"level":2,"text":"Mapping Table","id":"mapping-table"},{"level":2,"text":"Out-of-Scope Legacy Sections","id":"out-of-scope-legacy-sections"},{"level":2,"text":"Doctrine Updates","id":"doctrine-updates"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":100}];

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      themeToggleBtn.innerHTML = isDark ? '☀️ <span>Light Mode</span>' : '🌙 <span>Dark Mode</span>';
    });

    function renderTree(filter = '') {
      navTreeEl.innerHTML = '';
      const categories = {};
      const cleanFilter = filter.toLowerCase().trim();

      NODES.forEach((node) => {
        if (cleanFilter) {
          const matchTitle = node.title.toLowerCase().includes(cleanFilter);
          const matchPath = node.relativePath.toLowerCase().includes(cleanFilter);
          const matchContent = node.rawBody.toLowerCase().includes(cleanFilter);
          if (!matchTitle && !matchPath && !matchContent) return;
        }

        if (!categories[node.category]) categories[node.category] = [];
        categories[node.category].push(node);
      });

      for (const [catName, items] of Object.entries(categories)) {
        const groupEl = document.createElement('div');
        groupEl.className = 'tree-group';

        const groupTitle = document.createElement('div');
        groupTitle.className = 'tree-group-title';
        groupTitle.textContent = catName;
        groupEl.appendChild(groupTitle);

        items.forEach((item) => {
          const itemEl = document.createElement('a');
          itemEl.className = 'tree-item' + (item.id === activeNodeId ? ' active' : '');
          itemEl.innerHTML = `
            <span>${item.title}</span>
            <span class="badge">${item.headings.length}</span>
          `;
          itemEl.addEventListener('click', (e) => {
            e.preventDefault();
            loadNode(item.id);
          });
          groupEl.appendChild(itemEl);
        });

        navTreeEl.appendChild(groupEl);
      }
    }

    function loadNode(nodeId) {
      const node = NODES.find((n) => n.id === nodeId);
      if (!node) return;

      activeNodeId = nodeId;
      docCategoryEl.textContent = node.category;
      docPathEl.textContent = node.relativePath;

      const htmlContent = window.marked ? marked.parse(node.rawBody) : node.rawBody;
      docBodyEl.innerHTML = htmlContent;

      tocListEl.innerHTML = '';
      node.headings.forEach((h) => {
        if (h.level <= 3) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.textContent = h.text;
          a.href = '#' + h.id;
          a.style.paddingLeft = (h.level - 1) * 10 + 'px';
          li.appendChild(a);
          tocListEl.appendChild(li);
        }
      });

      renderTree(searchInput.value);
      document.getElementById('mainPane').scrollTop = 0;
    }

    searchInput.addEventListener('input', (e) => {
      renderTree(e.target.value);
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchInput.focus();
      }
    });

    renderTree();
    if (NODES[0]) loadNode(NODES[0].id);
  </script>
</body>
</html>
