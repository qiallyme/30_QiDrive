title's naming conventions. (`Sec. 10.05.010.L003`; stable ID `T10.A05.S010.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 5. Naming and Numbering","id":"article-5-naming-and-numbering"},{"level":3,"text":"Sec. 10.05.010. Folder Numbering Convention","id":"sec-1005010-folder-numbering-convention"}],"order":15},{"id":"title_10_qilabsarticle_06_lifecycle_and_archive_rulesmd","name":"article_06_lifecycle_and_archive_rules.md","relativePath":"title_10_qilabs/article_06_lifecycle_and_archive_rules.md","category":"TITLE 10 QILABS","title":"article_06_lifecycle_and_archive_rules","rawBody":"﻿---\nlayout: article\ntitle: Article 6. Lifecycle and Archive Rules\nslug: qicode-title-10-article-06-lifecycle-and-archive-rules\nsummary: \"\"\nstatus: publish\nupdated_at: \"2026-07-21\"\ntags:\n  - qicode\nqicode_title: 10\nqicode_article: 6\nparent_title: Title 10. QiLabs\ncanonical_ref: QiCode T10.A06\nsource_type: manual\n---\n\n## Article 6. Lifecycle and Archive Rules\n\nStable ID: `T10.A06`\n\n### Sec. 10.06.010. Archive Policy\n\nStable ID: `T10.A06.S010`\n\n- `Line 1` Retired or superseded material must be moved to a clearly labeled archive folder within the same domain. (`Sec. 10.06.010.L001`; stable ID `T10.A06.S010.L001`)\n- `Line 2` Archived content must retain its original frontmatter and a note explaining why it was archived. (`Sec. 10.06.010.L002`; stable ID `T10.A06.S010.L002`)\n- `Line 3` Do not delete root domain folders; update the governing title instead and archive subdirectories as needed. (`Sec. 10.06.010.L003`; stable ID `T10.A06.S010.L003`)\n\n\r\n","headings":[{"level":2,"text":"Article 6. Lifecycle and Archive Rules","id":"article-6-lifecycle-and-archive-rules"},{"level":3,"text":"Sec. 10.06.010. Archive Policy","id":"sec-1006010-archive-policy"}],"order":16},{"id":"title_11_qilabs_workspace_indexmd","name":"_index.md","relativePath":"title_11_qilabs_workspace/_index.md","category":"TITLE 11 QILABS WORKSPACE","title":"Title 11. QiLabs Workspace â€” Index","summary":"Index for QiCode Title 11, QiLabs Workspace.","status":"publish","rawBody":"# Title 11. QiLabs Workspace\n\n- Title Cover\n- Article 1. Workspace Purpose\n- Article 2. Templates\n- Article 3. Housekeeping\n- Article 4. Config and Manifests\n- Article 5. Codex and Agent Instructions\n- Article 6. Logs, Reports, and Plans","headings":[{"level":1,"text":"Title 11. QiLabs Workspace","id":"title-11-qilabs-workspace"}],"order":0},{"id":"title_11_qilabs_workspacetitle_11_qilabs_workspacemd","name":"title_11_qilabs_workspace.md","relativePath":"title_11_qilabs_workspace/title_11_qilabs_workspace.md","category":"TITLE 11 QILABS WORKSPACE","title":"Title 11. QiLabs Workspace","summary":"QiLabs Workspace governs 00_QiLabs.workspace â€” templates, housekeeping, configs, manifests, and operational support tools.","status":"publish","rawBody":"# Title 11. QiLabs Workspace\n\n## Citation\n\n- Legal citation: `QiCode Title 11`\n- Article citation: `QiCode Title 11, Article #`\n- Section citation: `QiCode Sec. 11.##.###`\n- Stable ID alias: `QiCode T11.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 11.001.L001` This title governs `00_QiLabs.workspace` â€” the operational support layer for the entire QiLabs root. (stable ID `T11.R001.L001`)\n- `Rule 11.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T11.R001.L002`)\n- `Rule 11.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T11.R001.L003`)\n\n## Articles\n\n- Article 1. Workspace Purpose\n- Article 2. Templates\n- Article 3. Housekeeping\n- Article 4. Config and Manifests\n- Article 5. Codex and Agent Instructions\n- Article 6. Logs, Reports, and Plans\n- Article 7. QiNotion Project Workspace\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Title 10 â€” QiLabs](title_10_qilabs.md)\n- [Migration Map](qilabs_title_migration_map.md)","headings":[{"level":1,"text":"Title 11. QiLabs Workspace","id":"title-11-qilabs-workspace"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_11_qilabs_workspacearticle_01_workspace_purposemd","name":"article_01_workspace_purpose.md","relativePath":"title_11_qilabs_workspace/article_01_workspace_purpose.md","category":"TITLE 11 QILABS WORKSPACE","title":"Article 1. Workspace Purpose","summary":"","status":"publish","rawBody":"## Article 1. Workspace Purpose\n\nStable ID: `T11.A01`\n\n### Sec. 11.01.010. Primary Function\n\nStable ID: `T11.A01.S010`\n\n- `Line 1` The workspace holds operational support material: templates, housekeeping tools, manifests, reports, and run scripts. (`Sec. 11.01.010.L001`; stable ID `T11.A01.S010.L001`)\n- `Line 2` The workspace is not the vault, app source, docs site, file archive, or server runtime. (`Sec. 11.01.010.L002`; stable ID `T11.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the material belongs in the governed domain it supports, not the workspace. (`Sec. 11.01.010.L003`; stable ID `T11.A01.S010.L003`)\n\n### Sec. 11.01.020. Scope Boundary\n\nStable ID: `T11.A01.S020`\n\n- `Line 1` Workspace material is tooling that operates on other domains, not domain content itself. (`Sec. 11.01.020.L001`; stable ID `T11.A01.S020.L001`)\n- `Line 2` Source of truth for vault, apps, and sites does not live in the workspace. (`Sec. 11.01.020.L002`; stable ID `T11.A01.S020.L002`)\n- `Line 3` Agent instructions, codex files, and shared configs belong here when they apply across the whole root. (`Sec. 11.01.020.L003`; stable ID `T11.A01.S020.L003`)","headings":[{"level":2,"text":"Article 1. Workspace Purpose","id":"article-1-workspace-purpose"},{"level":3,"text":"Sec. 11.01.010. Primary Function","id":"sec-1101010-primary-function"},{"level":3,"text":"Sec. 11.01.020. Scope Boundary","id":"sec-1101020-scope-boundary"}],"order":11},{"id":"title_11_qilabs_workspacearticle_02_templatesmd","name":"article_02_templates.md","relativePath":"title_11_qilabs_workspace/article_02_templates.md","category":"TITLE 11 QILABS WORKSPACE","title":"Article 2. Templates","summary":"","status":"publish","rawBody":"## Article 2. Templates\n\nStable ID: `T11.A02`\n\n### Sec. 11.02.010. Template Authority\n\nStable ID: `T11.A02.S010`\n\n- `Line 1` The canonical master template lives in `00_QiLabs.workspace/_qiconfig/master_template.md`. (`Sec. 11.02.010.L001`; stable ID `T11.A02.S010.L001`)\n- `Line 2` Vault templates must conform to master template frontmatter requirements. (`Sec. 11.02.010.L002`; stable ID `T11.A02.S010.L002`)\n- `Line 3` Templates must be reviewed before deployment to ensure required keys are present and type values are correct. (`Sec. 11.02.010.L003`; stable ID `T11.A02.S010.L003`)","headings":[{"level":2,"text":"Article 2. Templates","id":"article-2-templates"},{"level":3,"text":"Sec. 11.02.010. Template Authority","id":"sec-1102010-template-authority"}],"order":12},{"id":"title_11_qilabs_workspacearticle_03_housekeepingmd","name":"article_03_housekeeping.md","relativePath":"title_11_qilabs_workspace/article_03_housekeeping.md","category":"TITLE 11 QILABS WORKSPACE","title":"Article 3. Housekeeping","summary":"","status":"publish","rawBody":"## Article 3. Housekeeping\n\nStable ID: `T11.A03`\n\n### Sec. 11.03.010. Housekeeping Scope\n\nStable ID: `T11.A03.S010`\n\n- `Line 1` The housekeeping tool governs frontmatter normalization, tag validation, inventory, reports, and link rewriting. (`Sec. 11.03.010.L001`; stable ID `T11.A03.S010.L001`)\n- `Line 2` Broad renames must not be executed without a separately approved rename plan. (`Sec. 11.03.010.L002`; stable ID `T11.A03.S010.L002`)\n- `Line 3` Housekeeping must run dry-run first; apply only after review. (`Sec. 11.03.010.L003`; stable ID `T11.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. Housekeeping","id":"article-3-housekeeping"},{"level":3,"text":"Sec. 11.03.010. Housekeeping Scope","id":"sec-1103010-housekeeping-scope"}],"order":13},{"id":"title_11_qilabs_workspacearticle_04_config_and_manifestsmd","name":"article_04_config_and_manifests.md","relativePath":"title_11_qilabs_workspace/article_04_config_and_manifests.md","category":"TITLE 11 QILABS WORKSPACE","title":"Article 4. Config and Manifests","summary":"","status":"publish","rawBody":"## Article 4. Config and Manifests\n\nStable ID: `T11.A04`\n\n### Sec. 11.04.010. Configuration Authority\n\nStable ID: `T11.A04.S010`\n\n- `Line 1` Workspace `_qiconfig` holds canonical config for housekeeping, tags, and master templates. (`Sec. 11.04.010.L001`; stable ID `T11.A04.S010.L001`)\n- `Line 2` Config changes must be reviewed before applying any housekeeping run that depends on them. (`Sec. 11.04.010.L002`; stable ID `T11.A04.S010.L002`)\n- `Line 3` Manifests record point-in-time state and must not be used as live operational truth. (`Sec. 11.04.010.L003`; stable ID `T11.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. Config and Manifests","id":"article-4-config-and-manifests"},{"level":3,"text":"Sec. 11.04.010. Configuration Authority","id":"sec-1104010-configuration-authority"}],"order":14},{"id":"title_11_qilabs_workspacearticle_05_codex_and_agent_instructionsmd","name":"article_05_codex_and_agent_instructions.md","relativePath":"title_11_qilabs_workspace/article_05_codex_and_agent_instructions.md","category":"TITLE 11 QILABS WORKSPACE","title":"Article 5. Codex and Agent Instructions","summary":"","status":"publish","rawBody":"## Article 5. Codex and Agent Instructions\n\nStable ID: `T11.A05`\n\n### Sec. 11.05.010. Agent Governance\n\nStable ID: `T11.A05.S010`\n\n- `Line 1` Agent instructions, AGENTS.md, and skill files that apply across the whole root are managed from the workspace. (`Sec. 11.05.010.L001`; stable ID `T11.A05.S010.L001`)\n- `Line 2` Agent instructions must not contradict QiCode doctrine; when conflict exists, QiCode governs. (`Sec. 11.05.010.L002`; stable ID `T11.A05.S010.L002`)\n- `Line 3` Skills and agents with domain-specific scope belong in `.agents` at the domain root, not the workspace. (`Sec. 11.05.010.L003`; stable ID `T11.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. Codex and Agent Instructions","id":"article-5-codex-and-agent-instructions"},{"level":3,"text":"Sec. 11.05.010. Agent Governance","id":"sec-1105010-agent-governance"}],"order":15},{"id":"title_11_qilabs_workspacearticle_06_logs_reports_and_plansmd","name":"article_06_logs_reports_and_plans.md","relativePath":"title_11_qilabs_workspace/article_06_logs_reports_and_plans.md","category":"TITLE 11 QILABS WORKSPACE","title":"Article 6. Logs, Reports, and Plans","summary":"","status":"publish","rawBody":"## Article 6. Logs, Reports, and Plans\n\nStable ID: `T11.A06`\n\n### Sec. 11.06.010. Log Retention\n\nStable ID: `T11.A06.S010`\n\n- `Line 1` Housekeeping run logs, reports, and plans are stored in the workspace toolbox; they are not vault knowledge. (`Sec. 11.06.010.L001`; stable ID `T11.A06.S010.L001`)\n- `Line 2` Plans must be reviewed before applying; approved plans are the only basis for `apply` runs. (`Sec. 11.06.010.L002`; stable ID `T11.A06.S010.L002`)\n- `Line 3` Summaries may be promoted to vault outputs when they contain institutional knowledge worth preserving. (`Sec. 11.06.010.L003`; stable ID `T11.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Logs, Reports, and Plans","id":"article-6-logs-reports-and-plans"},{"level":3,"text":"Sec. 11.06.010. Log Retention","id":"sec-1106010-log-retention"}],"order":16},{"id":"title_11_qilabs_workspacearticle_07_qinotion_project_workspacemd","name":"article_07_qinotion_project_workspace.md","relativePath":"title_11_qilabs_workspace/article_07_qinotion_project_workspace.md","category":"TITLE 11 QILABS WORKSPACE","title":"Article 7. QiNotion Project Workspace","summary":"Defines the Notion-only project workspace architecture, preventing unnecessary filesystem mirroring.","status":"publish","rawBody":"## Article 7. QiNotion Project Workspace\n\nStable ID: `T11.A07`\n\n### Sec. 11.07.010. Purpose and System Boundaries\n\nStable ID: `T11.A07.S010`\n\n- `Line 1` QiNotion provides a lightweight workspace for projects currently being managed in Notion. (`Sec. 11.07.010.L001`; stable ID `T11.A07.S010.L001`)\n- `Line 2` It does not reproduce the full QiLabs ecosystem hierarchy. Only active or intentionally tracked projects should exist in the Notion Projects database. Systems that are not being managed in Notion do not need corresponding pages, folders, or placeholder records. (`Sec. 11.07.010.L002`; stable ID `T11.A07.S010.L002`)\n- `Line 3` Notion provides project coordination, shared databases, active workspace views, and temporary capture. (`Sec. 11.07.010.L003`; stable ID `T11.A07.S010.L003`)\n- `Line 4` GitHub provides software source code, technical implementation, issues, releases, and repository truth. (`Sec. 11.07.010.L004`; stable ID `T11.A07.S010.L004`)\n- `Line 5` QiCode provides canonical ecosystem doctrine, architecture, naming, governance, and system definitions. (`Sec. 11.07.010.L005`; stable ID `T11.A07.S010.L005`)\n- `Line 6` Obsidian / QiVault provides durable documentation, research, knowledge, decisions, timelines, and long-term records. (`Sec. 11.07.010.L006`; stable ID `T11.A07.S010.L006`)\n- `Line 7` QiLife will be the future primary operating interface for projects, tasks, people, events, knowledge, and life operations. (`Sec. 11.07.010.L007`; stable ID `T11.A07.S010.L007`)\n- `Line 8` Notion is a temporary and focused project-management surface until the relevant capabilities are implemented in QiLife and QiVault, and it is not the permanent source of truth for the entire QiLabs ecosystem. (`Sec. 11.07.010.L008`; stable ID `T11.A07.S010.L008`)\n\n### Sec. 11.07.020. Non-Goals\n\nStable ID: `T11.A07.S020`\n\n- `Line 1` QiNotion does not mirror every QiLabs folder or contain a page for every QiLabs system. (`Sec. 11.07.020.L001`; stable ID `T11.A07.S020.L001`)\n- `Line 2` QiNotion does not replace QiCode, GitHub, or QiVault, nor does it act as a second Life OS. (`Sec. 11.07.020.L002`; stable ID `T11.A07.S020.L002`)\n- `Line 3` QiNotion does not use navigation pages as workflow statuses, create separate databases for every project, or require projects to be physically moved when their state changes. (`Sec. 11.07.020.L003`; stable ID `T11.A07.S020.L003`)\n- `Line 4` QiNotion does not dictate or control the canonical QiLabs filesystem. (`Sec. 11.07.020.L004`; stable ID `T11.A07.S020.L004`)\n\n### Sec. 11.07.030. Canonical Notion Structure\n\nStable ID: `T11.A07.S030`\n\n- `Line 1` The canonical Notion structure comprises the following five databases (not filesystem directories): Projects, Tasks, People, Insights, and Timeline. (`Sec. 11.07.030.L001`; stable ID `T11.A07.S030.L001`)\n- `Line 2` The only permanent top-level Notion page required is named `QiLabs Workspace`. The five databases may exist directly inside or beneath that page. (`Sec. 11.07.030.L002`; stable ID `T11.A07.S030.L002`)\n- `Line 3` Pages and database records represent stable entities. Properties represent changing conditions. Views represent temporary perspectives. (`Sec. 11.07.030.L003`; stable ID `T11.A07.S030.L003`)\n- `Line 4` Statuses (such as Active, Paused, Waiting, Now, Next, Later, This Week, Completed, Archived) must never become navigation pages or folders. Status, priority, stage, scheduling, and similar workflow concepts belong in database properties and filtered views. (`Sec. 11.07.030.L004`; stable ID `T11.A07.S030.L004`)\n- `Line 5` Records do not move between folders when their status changes. (`Sec. 11.07.030.L005`; stable ID `T11.A07.S030.L005`)\n\n### Sec. 11.07.040. Projects Database\n\nStable ID: `T11.A07.S040`\n\n- `Line 1` One shared Notion database conceptually named `Projects` shall exist. Each record represents a project currently being managed through Notion. (`Sec. 11.07.040.L001`; stable ID `T11.A07.S040.L001`)\n- `Line 2` Recommended properties include: Project, QiCode, System, Project Type, Status, Priority, Repository, Obsidian Path, Started, and Target. (`Sec. 11.07.040.L002`; stable ID `T11.A07.S040.L002`)\n- `Line 3` The `System` property links the project conceptually to the QiLabs ecosystem (e.g., QiLabs, QiSpark, QiServer, QiWorkers, QiDrive, QiVault, QiApps, QiSites) without recreating the ecosystem as Notion folders. These values are classifications only and must not generate filesystem changes. (`Sec. 11.07.040.L003`; stable ID `T11.A07.S040.L003`)\n\n### Sec. 11.07.050. Canonical Project Page Template\n\nStable ID: `T11.A07.S050`\n\n- `Line 1` Every Projects database record should use the same stable page template. (`Sec. 11.07.050.L001`; stable ID `T11.A07.S050.L001`)\n- `Line 2` The template includes a \"Project Brief\" (Purpose, Outcome, Current Architecture, Source Systems) and linked views of Tasks, Insights, Timeline, and People, all filtered to the current project. (`Sec. 11.07.050.L002`; stable ID `T11.A07.S050.L002`)\n- `Line 3` A unique page architecture must not be created for each project. The template must remain stable so projects can be created and used without redesigning Notion. (`Sec. 11.07.050.L003`; stable ID `T11.A07.S050.L003`)\n\n### Sec. 11.07.060. Tasks Database\n\nStable ID: `T11.A07.S060`\n\n- `Line 1` One shared Notion database conceptually named `Tasks` shall exist for all projects. (`Sec. 11.07.060.L001`; stable ID `T11.A07.S060.L001`)\n- `Line 2` Recommended properties include: Task, Project, Parent Task, Status, Priority, Due, Scheduled, and Context. (`Sec. 11.07.060.L002`; stable ID `T11.A07.S060.L002`)\n- `Line 3` Project pages display filtered linked views where `Project = Current Project`. Separate task databases for individual projects must not be created. (`Sec. 11.07.060.L003`; stable ID `T11.A07.S060.L003`)\n\n### Sec. 11.07.070. People Database\n\nStable ID: `T11.A07.S070`\n\n- `Line 1` One shared Notion database conceptually named `People` shall exist. (`Sec. 11.07.070.L001`; stable ID `T11.A07.S070.L001`)\n- `Line 2` Recommended properties include: Name, Relationship, Organization, Role, Projects, Contact Information, Notes, and Last Contact. (`Sec. 11.07.070.L002`; stable ID `T11.A07.S070.L002`)\n- `Line 3` This database serves as a temporary shared directory until the information is migrated into the appropriate long-term QiLife or QiVault structure. (`Sec. 11.07.070.L003`; stable ID `T11.A07.S070.L003`)\n\n### Sec. 11.07.080. Insights Database\n\nStable ID: `T11.A07.S080`\n\n- `Line 1` One shared Notion database conceptually named `Insights` shall exist, allowing discoveries and thoughts to be captured without changing project structure. (`Sec. 11.07.080.L001`; stable ID `T11.A07.S080.L001`)\n- `Line 2` Recommended properties include: Insight, Type, Project, People, Source, Created, Promoted to Obsidian, and Obsidian Path. (`Sec. 11.07.080.L002`; stable ID `T11.A07.S080.L002`)\n- `Line 3` Once an insight becomes durable doctrine, documentation, research, or knowledge, it should be promoted to Obsidian/QiVault and linked back from Notion. (`Sec. 11.07.080.L003`; stable ID `T11.A07.S080.L003`)\n\n### Sec. 11.07.090. Timeline Database\n\nStable ID: `T11.A07.S090`\n\n- `Line 1` One shared Notion database conceptually named `Timeline` shall exist to record meaningful historical events. (`Sec. 11.07.090.L001`; stable ID `T11.A07.S090.L001`)\n- `Line 2` Recommended properties include: Event, Date, Project, People, Event Type, Summary, Source, Promoted to Obsidian, and Obsidian Path. (`Sec. 11.07.090.L002`; stable ID `T11.A07.S090.L002`)\n- `Line 3` Timeline is not a duplicate task completion log. Do not create timeline entries for every minor task unless the event has historical, operational, or analytical value. (`Sec. 11.07.090.L003`; stable ID `T11.A07.S090.L003`)\n- `Line 4` Timeline content is expected to move into Obsidian/QiVault later. (`Sec. 11.07.090.L004`; stable ID `T11.A07.S090.L004`)","headings":[{"level":2,"text":"Article 7. QiNotion Project Workspace","id":"article-7-qinotion-project-workspace"},{"level":3,"text":"Sec. 11.07.010. Purpose and System Boundaries","id":"sec-1107010-purpose-and-system-boundaries"},{"level":3,"text":"Sec. 11.07.020. Non-Goals","id":"sec-1107020-non-goals"},{"level":3,"text":"Sec. 11.07.030. Canonical Notion Structure","id":"sec-1107030-canonical-notion-structure"},{"level":3,"text":"Sec. 11.07.040. Projects Database","id":"sec-1107040-projects-database"},{"level":3,"text":"Sec. 11.07.050. Canonical Project Page Template","id":"sec-1107050-canonical-project-page-template"},{"level":3,"text":"Sec. 11.07.060. Tasks Database","id":"sec-1107060-tasks-database"},{"level":3,"text":"Sec. 11.07.070. People Database","id":"sec-1107070-people-database"},{"level":3,"text":"Sec. 11.07.080. Insights Database","id":"sec-1107080-insights-database"},{"level":3,"text":"Sec. 11.07.090. Timeline Database","id":"sec-1107090-timeline-database"}],"order":17},{"id":"title_12_qispark_indexmd","name":"_index.md","relativePath":"title_12_qispark/_index.md","category":"TITLE 12 QISPARK","title":"Title 12. QiSpark â€” Index","summary":"Index for QiCode Title 12, QiSpark.","status":"publish","rawBody":"# Title 12. QiSpark\n\n- Title Cover\n- Article 1. QiSpark Purpose\n- Article 2. Landing Page\n- Article 3. Documentation Structure\n- Article 4. QiDNA and Doctrine\n- Article 5. Publishing Rules\n- Article 6. Public and Private Boundary\n- Article 7. Build and Deployment","headings":[{"level":1,"text":"Title 12. QiSpark","id":"title-12-qispark"}],"order":0},{"id":"title_12_qisparktitle_12_qisparkmd","name":"title_12_qispark.md","relativePath":"title_12_qispark/title_12_qispark.md","category":"TITLE 12 QISPARK","title":"Title 12. QiSpark","summary":"QiSpark is the docs, landing, doctrine, map, and navigation layer for the QiLabs system.","status":"publish","rawBody":"# Title 12. QiSpark\n\n## Citation\n\n- Legal citation: `QiCode Title 12`\n- Article citation: `QiCode Title 12, Article #`\n- Section citation: `QiCode Sec. 12.##.###`\n- Stable ID alias: `QiCode T12.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 12.001.L001` This title governs `10_Qispark` as the docs, landing, doctrine, and navigation layer. (stable ID `T12.R001.L001`)\n- `Rule 12.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T12.R001.L002`)\n- `Rule 12.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T12.R001.L003`)\n\n## Articles\n\n- Article 1. QiSpark Purpose\n- Article 2. Landing Page\n- Article 3. Documentation Structure\n- Article 4. QiDNA and Doctrine\n- Article 5. Publishing Rules\n- Article 6. Public and Private Boundary\n- Article 7. Build and Deployment\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Title 10 â€” QiLabs](title_10_qilabs.md)\n- [Migration Map](qilabs_title_migration_map.md)","headings":[{"level":1,"text":"Title 12. QiSpark","id":"title-12-qispark"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_12_qisparkarticle_01_qispark_purposemd","name":"article_01_qispark_purpose.md","relativePath":"title_12_qispark/article_01_qispark_purpose.md","category":"TITLE 12 QISPARK","title":"Article 1. QiSpark Purpose","summary":"","status":"publish","rawBody":"## Article 1. QiSpark Purpose\n\nStable ID: `T12.A01`\n\n### Sec. 12.01.010. Primary Function\n\nStable ID: `T12.A01.S010`\n\n- `Line 1` QiSpark is the docs and landing layer: it explains, maps, and routes between QiLabs domains. (`Sec. 12.01.010.L001`; stable ID `T12.A01.S010.L001`)\n- `Line 2` QiSpark must not operate life data; it navigates and documents, it does not store personal records. (`Sec. 12.01.010.L002`; stable ID `T12.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 12.01.010.L003`; stable ID `T12.A01.S010.L003`)\n\n### Sec. 12.01.020. Scope\n\nStable ID: `T12.A01.S020`\n\n- `Line 1` QiSpark may include the homepage, navigation bookmarks, and the QiDNA doctrine content layer. (`Sec. 12.01.020.L001`; stable ID `T12.A01.S020.L001`)\n- `Line 2` QiDNA is doctrine content inside QiSpark docs, not a separate system or module. (`Sec. 12.01.020.L002`; stable ID `T12.A01.S020.L002`)\n- `Line 3` QiAccess is retired as a standalone module; its navigation function is absorbed into QiSpark. (`Sec. 12.01.020.L003`; stable ID `T12.A01.S020.L003`)","headings":[{"level":2,"text":"Article 1. QiSpark Purpose","id":"article-1-qispark-purpose"},{"level":3,"text":"Sec. 12.01.010. Primary Function","id":"sec-1201010-primary-function"},{"level":3,"text":"Sec. 12.01.020. Scope","id":"sec-1201020-scope"}],"order":11},{"id":"title_12_qisparkarticle_02_landing_pagemd","name":"article_02_landing_page.md","relativePath":"title_12_qispark/article_02_landing_page.md","category":"TITLE 12 QISPARK","title":"Article 2. Landing Page","summary":"","status":"publish","rawBody":"## Article 2. Landing Page\n\nStable ID: `T12.A02`\n\n### Sec. 12.02.010. Homepage Rule\n\nStable ID: `T12.A02.S010`\n\n- `Line 1` The QiLabs homepage or navigation hub is a QiSpark output, not a QiApps product. (`Sec. 12.02.010.L001`; stable ID `T12.A02.S010.L001`)\n- `Line 2` The homepage routes to governed domains; it does not duplicate content owned by other titles. (`Sec. 12.02.010.L002`; stable ID `T12.A02.S010.L002`)\n- `Line 3` Homepage decisions must be documented in QiSpark ADRs or equivalent. (`Sec. 12.02.010.L003`; stable ID `T12.A02.S010.L003`)","headings":[{"level":2,"text":"Article 2. Landing Page","id":"article-2-landing-page"},{"level":3,"text":"Sec. 12.02.010. Homepage Rule","id":"sec-1202010-homepage-rule"}],"order":12},{"id":"title_12_qisparkarticle_03_documentation_structuremd","name":"article_03_documentation_structure.md","relativePath":"title_12_qispark/article_03_documentation_structure.md","category":"TITLE 12 QISPARK","title":"Article 3. Documentation Structure","summary":"","status":"publish","rawBody":"## Article 3. Documentation Structure\n\nStable ID: `T12.A03`\n\n### Sec. 12.03.010. Docs Hierarchy\n\nStable ID: `T12.A03.S010`\n\n- `Line 1` QiSpark docs are organized as: Policies â†’ Rules and Standards â†’ Registries â†’ Schemas â†’ Decisions (ADRs). (`Sec. 12.03.010.L001`; stable ID `T12.A03.S010.L001`)\n- `Line 2` Each layer governs a different level of abstraction and must not be used as a dump for the other. (`Sec. 12.03.010.L002`; stable ID `T12.A03.S010.L002`)\n- `Line 3` Duplicate docs in the legacy source are not migrated; only the canonical version is authoritative. (`Sec. 12.03.010.L003`; stable ID `T12.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. Documentation Structure","id":"article-3-documentation-structure"},{"level":3,"text":"Sec. 12.03.010. Docs Hierarchy","id":"sec-1203010-docs-hierarchy"}],"order":13},{"id":"title_12_qisparkarticle_04_qidna_and_doctrinemd","name":"article_04_qidna_and_doctrine.md","relativePath":"title_12_qispark/article_04_qidna_and_doctrine.md","category":"TITLE 12 QISPARK","title":"Article 4. QiDNA and Doctrine","summary":"","status":"publish","rawBody":"## Article 4. QiDNA and Doctrine\n\nStable ID: `T12.A04`\n\n### Sec. 12.04.010. QiDNA is Doctrine Content\n\nStable ID: `T12.A04.S010`\n\n- `Line 1` QiDNA refers to the core doctrine, principles, and identity narrative content housed within QiSpark documentation. (`Sec. 12.04.010.L001`; stable ID `T12.A04.S010.L001`)\n- `Line 2` QiDNA must not be treated as a separate module, folder domain, or deployment target. (`Sec. 12.04.010.L002`; stable ID `T12.A04.S010.L002`)\n- `Line 3` QiCode Titles 01â€“09 are the canonical personal doctrine; QiSpark/QiDNA extends this into the technical/system layer. (`Sec. 12.04.010.L003`; stable ID `T12.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. QiDNA and Doctrine","id":"article-4-qidna-and-doctrine"},{"level":3,"text":"Sec. 12.04.010. QiDNA is Doctrine Content","id":"sec-1204010-qidna-is-doctrine-content"}],"order":14},{"id":"title_12_qisparkarticle_05_publishing_rulesmd","name":"article_05_publishing_rules.md","relativePath":"title_12_qispark/article_05_publishing_rules.md","category":"TITLE 12 QISPARK","title":"Article 5. Publishing Rules","summary":"","status":"publish","rawBody":"## Article 5. Publishing Rules\n\nStable ID: `T12.A05`\n\n### Sec. 12.05.010. Public vs. Private\n\nStable ID: `T12.A05.S010`\n\n- `Line 1` QiSpark content that is published publicly must pass a sensitivity review before deployment. (`Sec. 12.05.010.L001`; stable ID `T12.A05.S010.L001`)\n- `Line 2` Private doctrine, personal records, legal material, and evidence must not be included in any QiSpark public build. (`Sec. 12.05.010.L002`; stable ID `T12.A05.S010.L002`)\n- `Line 3` The `sensitivity` frontmatter field governs inclusion; files marked `internal` or higher must not be published. (`Sec. 12.05.010.L003`; stable ID `T12.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. Publishing Rules","id":"article-5-publishing-rules"},{"level":3,"text":"Sec. 12.05.010. Public vs. Private","id":"sec-1205010-public-vs-private"}],"order":15},{"id":"title_12_qisparkarticle_06_public_and_private_boundarymd","name":"article_06_public_and_private_boundary.md","relativePath":"title_12_qispark/article_06_public_and_private_boundary.md","category":"TITLE 12 QISPARK","title":"Article 6. Public and Private Boundary","summary":"","status":"publish","rawBody":"## Article 6. Public and Private Boundary\n\nStable ID: `T12.A06`\n\n### Sec. 12.06.010. Boundary Definition\n\nStable ID: `T12.A06.S010`\n\n- `Line 1` The public boundary is the set of docs that can be shipped in a static site or accessible via a public URL. (`Sec. 12.06.010.L001`; stable ID `T12.A06.S010.L001`)\n- `Line 2` Everything inside `40_QiVault`, `30_QiDrive`, and protected case folders is private by default. (`Sec. 12.06.010.L002`; stable ID `T12.A06.S010.L002`)\n- `Line 3` Explicit `publish_target` in frontmatter is required to move a file across the public boundary. (`Sec. 12.06.010.L003`; stable ID `T12.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Public and Private Boundary","id":"article-6-public-and-private-boundary"},{"level":3,"text":"Sec. 12.06.010. Boundary Definition","id":"sec-1206010-boundary-definition"}],"order":16},{"id":"title_12_qisparkarticle_07_build_and_deploymentmd","name":"article_07_build_and_deployment.md","relativePath":"title_12_qispark/article_07_build_and_deployment.md","category":"TITLE 12 QISPARK","title":"Article 7. Build and Deployment","summary":"","status":"publish","rawBody":"## Article 7. Build and Deployment\n\nStable ID: `T12.A07`\n\n### Sec. 12.07.010. Build Rules\n\nStable ID: `T12.A07.S010`\n\n- `Line 1` QiSpark sites are built with static site tooling; the build target is separate from the source vault. (`Sec. 12.07.010.L001`; stable ID `T12.A07.S010.L001`)\n- `Line 2` Build outputs belong in `70_QiSites`; do not commit build artifacts into the source docs. (`Sec. 12.07.010.L002`; stable ID `T12.A07.S010.L002`)\n- `Line 3` Deployment decisions must be documented in QiSpark ADRs or equivalent. (`Sec. 12.07.010.L003`; stable ID `T12.A07.S010.L003`)","headings":[{"level":2,"text":"Article 7. Build and Deployment","id":"article-7-build-and-deployment"},{"level":3,"text":"Sec. 12.07.010. Build Rules","id":"sec-1207010-build-rules"}],"order":17},{"id":"title_13_qiserver_indexmd","name":"_index.md","relativePath":"title_13_qiserver/_index.md","category":"TITLE 13 QISERVER","title":"Title 13. QiServer â€” Index","summary":"Index for QiCode Title 13, QiServer.","status":"publish","rawBody":"# Title 13. QiServer\n\n- Title Cover\n- Article 1. Runtime Authority\n- Article 2. Server Services\n- Article 3. Docker and Containers\n- Article 4. Databases\n- Article 5. Local AI\n- Article 6. Security and Access\n- Article 7. Backups and Recovery\n- Article 8. Path Doctrine","headings":[{"level":1,"text":"Title 13. QiServer","id":"title-13-qiserver"}],"order":0},{"id":"title_13_qiservertitle_13_qiservermd","name":"title_13_qiserver.md","relativePath":"title_13_qiserver/title_13_qiserver.md","category":"TITLE 13 QISERVER","title":"Title 13. QiServer","summary":"QiServer governs 20_QiServer â€” the runtime, infrastructure, services, and operations layer of QiLabs.","status":"publish","rawBody":"# Title 13. QiServer\n\n## Citation\n\n- Legal citation: `QiCode Title 13`\n- Article citation: `QiCode Title 13, Article #`\n- Section citation: `QiCode Sec. 13.##.###`\n- Stable ID alias: `QiCode T13.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 13.001.L001` This title governs `20_QiServer` â€” the runtime and infrastructure layer on the physical server `qiserver` (Tailscale: `qiserver-1`). (stable ID `T13.R001.L001`)\n- `Rule 13.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T13.R001.L002`)\n- `Rule 13.001.L003` Verified runtime facts win over repo planning notes when they conflict. (stable ID `T13.R001.L003`)\n\n## Articles\n\n- Article 1. Runtime Authority\n- Article 2. Server Services\n- Article 3. Docker and Containers\n- Article 4. Databases\n- Article 5. Local AI\n- Article 6. Security and Access\n- Article 7. Backups and Recovery\n- Article 8. Path Doctrine\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Title 10 â€” QiLabs](title_10_qilabs.md)\n- [Migration Map](qilabs_title_migration_map.md)\n- [Legacy Service Map](../../../../50_QiLabs/20_QiServer/Service_Map.md)","headings":[{"level":1,"text":"Title 13. QiServer","id":"title-13-qiserver"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_13_qiserverarticle_01_runtime_authoritymd","name":"article_01_runtime_authority.md","relativePath":"title_13_qiserver/article_01_runtime_authority.md","category":"TITLE 13 QISERVER","title":"Article 1. Runtime Authority","summary":"","status":"publish","rawBody":"## Article 1. Runtime Authority\n\nStable ID: `T13.A01`\n\n### Sec. 13.01.010. Primary Function\n\nStable ID: `T13.A01.S010`\n\n- `Line 1` QiServer is the runtime and infrastructure layer: it hosts services, databases, containers, and local AI. (`Sec. 13.01.010.L001`; stable ID `T13.A01.S010.L001`)\n- `Line 2` QiServer must not be used as a docs site, vault, or life app layer. (`Sec. 13.01.010.L002`; stable ID `T13.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 13.01.010.L003`; stable ID `T13.A01.S010.L003`)","headings":[{"level":2,"text":"Article 1. Runtime Authority","id":"article-1-runtime-authority"},{"level":3,"text":"Sec. 13.01.010. Primary Function","id":"sec-1301010-primary-function"}],"order":11},{"id":"title_13_qiserverarticle_02_server_servicesmd","name":"article_02_server_services.md","relativePath":"title_13_qiserver/article_02_server_services.md","category":"TITLE 13 QISERVER","title":"Article 2. Server Services","summary":"","status":"publish","rawBody":"## Article 2. Server Services\n\nStable ID: `T13.A02`\n\n### Sec. 13.02.010. Service Catalog\n\nStable ID: `T13.A02.S010`\n\n- `Line 1` Verified active services on QiServer include: Cockpit, Portainer, GetHomepage, Tailscale, Cloudflared, Uptime Kuma, Open WebUI, Ollama, Neo4j, Qdrant, n8n, SolidTime, Firefly III, Wiki.js, Paperless-ngx, BookStack, DailyWave, QiTTS, and QiTranscribe. (`Sec. 13.02.010.L001`; stable ID `T13.A02.S010.L001`)\n- `Line 2` Each service must have a corresponding runbook or documentation file in `20_QiServer`; the canonical service map is `20_QiServer/Service_Map.md`. (`Sec. 13.02.010.L002`; stable ID `T13.A02.S010.L002`)\n- `Line 3` Services with public exposure must be documented in a security review before activation; the public restricted entry point is `https://access.qially.com` via Cloudflared tunnel. (`Sec. 13.02.010.L003`; stable ID `T13.A02.S010.L003`)","headings":[{"level":2,"text":"Article 2. Server Services","id":"article-2-server-services"},{"level":3,"text":"Sec. 13.02.010. Service Catalog","id":"sec-1302010-service-catalog"}],"order":12},{"id":"title_13_qiserverarticle_03_docker_and_containersmd","name":"article_03_docker_and_containers.md","relativePath":"title_13_qiserver/article_03_docker_and_containers.md","category":"TITLE 13 QISERVER","title":"Article 3. Docker and Containers","summary":"","status":"publish","rawBody":"## Article 3. Docker and Containers\n\nStable ID: `T13.A03`\n\n### Sec. 13.03.010. Container Governance\n\nStable ID: `T13.A03.S010`\n\n- `Line 1` All containerized services must be defined in version-controlled Docker Compose files. (`Sec. 13.03.010.L001`; stable ID `T13.A03.S010.L001`)\n- `Line 2` Container configurations must not include secrets inline; use environment files or secrets managers. (`Sec. 13.03.010.L002`; stable ID `T13.A03.S010.L002`)\n- `Line 3` Portainer manages container state; Portainer itself is governed by QiServer. (`Sec. 13.03.010.L003`; stable ID `T13.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. Docker and Containers","id":"article-3-docker-and-containers"},{"level":3,"text":"Sec. 13.03.010. Container Governance","id":"sec-1303010-container-governance"}],"order":13},{"id":"title_13_qiserverarticle_04_databasesmd","name":"article_04_databases.md","relativePath":"title_13_qiserver/article_04_databases.md","category":"TITLE 13 QISERVER","title":"Article 4. Databases","summary":"","status":"publish","rawBody":"## Article 4. Databases\n\nStable ID: `T13.A04`\n\n### Sec. 13.04.010. Database Authority\n\nStable ID: `T13.A04.S010`\n\n- `Line 1` Local databases hosted on QiServer (Neo4j, Qdrant, Firefly III DB, BookStack DB, SolidTime DB) are governed by QiServer doctrine for access, backups, and migrations. (`Sec. 13.04.010.L001`; stable ID `T13.A04.S010.L001`)\n- `Line 2` Supabase is a cloud-hosted SaaS database and is the canonical data authority for QiLife and connected apps; it is NOT hosted on QiServer â€” QiServer connects to it remotely (ADR-0018). (`Sec. 13.04.010.L002`; stable ID `T13.A04.S010.L002`)\n- `Line 3` Directus is the admin UI and API layer for Supabase/Postgres per ADR-0019; NocoDB is deprecated and scheduled for decommissioning. Schema changes must be versioned migration scripts, not Directus-panel edits. (`Sec. 13.04.010.L003`; stable ID `T13.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. Databases","id":"article-4-databases"},{"level":3,"text":"Sec. 13.04.010. Database Authority","id":"sec-1304010-database-authority"}],"order":14},{"id":"title_13_qiserverarticle_05_local_aimd","name":"article_05_local_ai.md","relativePath":"title_13_qiserver/article_05_local_ai.md","category":"TITLE 13 QISERVER","title":"Article 5. Local AI","summary":"","status":"publish","rawBody":"## Article 5. Local AI\n\nStable ID: `T13.A05`\n\n### Sec. 13.05.010. AI Compute Governance\n\nStable ID: `T13.A05.S010`\n\n- `Line 1` Local AI services (Ollama, Open WebUI, Qdrant, Neo4j) are hosted and governed under QiServer; the active chat model is `llama3.2` and the embedding model is `embeddinggemma`. (`Sec. 13.05.010.L001`; stable ID `T13.A05.S010.L001`)\n- `Line 2` AI models and vector indexes must be versioned and documented in `20_QiServer/10_ai_compute`; graph and vector outputs are derived â€” they are not canonical sources of truth. (`Sec. 13.05.010.L002`; stable ID `T13.A05.S010.L002`)\n- `Line 3` Local AI services must not process protected legal or evidence records without explicit governance review; QiTTS and QiTranscribe are local AI services subject to this rule. (`Sec. 13.05.010.L003`; stable ID `T13.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. Local AI","id":"article-5-local-ai"},{"level":3,"text":"Sec. 13.05.010. AI Compute Governance","id":"sec-1305010-ai-compute-governance"}],"order":15},{"id":"title_13_qiserverarticle_06_security_and_accessmd","name":"article_06_security_and_access.md","relativePath":"title_13_qiserver/article_06_security_and_access.md","category":"TITLE 13 QISERVER","title":"Article 6. Security and Access","summary":"","status":"publish","rawBody":"## Article 6. Security and Access\n\nStable ID: `T13.A06`\n\n### Sec. 13.06.010. Access Control\n\nStable ID: `T13.A06.S010`\n\n- `Line 1` Tailscale governs remote access to QiServer; no other VPN or direct exposure is permitted without documentation. (`Sec. 13.06.010.L001`; stable ID `T13.A06.S010.L001`)\n- `Line 2` Cloudflare is the public edge; it proxies and protects any public-facing QiServer endpoints. (`Sec. 13.06.010.L002`; stable ID `T13.A06.S010.L002`)\n- `Line 3` All public interfaces must be documented in a `public_interfaces.md` file in `20_QiServer`. (`Sec. 13.06.010.L003`; stable ID `T13.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Security and Access","id":"article-6-security-and-access"},{"level":3,"text":"Sec. 13.06.010. Access Control","id":"sec-1306010-access-control"}],"order":16},{"id":"title_13_qiserverarticle_07_backups_and_recoverymd","name":"article_07_backups_and_recovery.md","relativePath":"title_13_qiserver/article_07_backups_and_recovery.md","category":"TITLE 13 QISERVER","title":"Article 7. Backups and Recovery","summary":"","status":"publish","rawBody":"## Article 7. Backups and Recovery\n\nStable ID: `T13.A07`\n\n### Sec. 13.07.010. Backup Policy\n\nStable ID: `T13.A07.S010`\n\n- `Line 1` All QiServer databases and critical service configurations must have a documented backup schedule. (`Sec. 13.07.010.L001`; stable ID `T13.A07.S010.L001`)\n- `Line 2` Recovery procedures must be documented and tested before the system is considered production-ready; re-entry starts with `/srv/qios/docs/000_RUN_ME_FIRST.md`. (`Sec. 13.07.010.L002`; stable ID `T13.A07.S010.L002`)\n- `Line 3` Backup storage must not rely solely on the same physical server being backed up. (`Sec. 13.07.010.L003`; stable ID `T13.A07.S010.L003`)","headings":[{"level":2,"text":"Article 7. Backups and Recovery","id":"article-7-backups-and-recovery"},{"level":3,"text":"Sec. 13.07.010. Backup Policy","id":"sec-1307010-backup-policy"}],"order":17},{"id":"title_13_qiserverarticle_08_path_doctrinemd","name":"article_08_path_doctrine.md","relativePath":"title_13_qiserver/article_08_path_doctrine.md","category":"TITLE 13 QISERVER","title":"Article 8. Path Doctrine","summary":"","status":"publish","rawBody":"## Article 8. Path Doctrine\n\nStable ID: `T13.A08`\n\n### Sec. 13.08.010. Server Path Standards\n\nStable ID: `T13.A08.S010`\n\n- `Line 1` QiServer runtime root is `/srv/qios`; repos live in `/srv/qios/repos`, Docker Compose stacks in `/srv/qios/stacks`, persistent app data in `/srv/qios/data`. (`Sec. 13.08.010.L001`; stable ID `T13.A08.S010.L001`)\n- `Line 2` Do not create nested Git repos inside `/srv/qios/stacks`; repo source lives in `/srv/qios/repos` only. (`Sec. 13.08.010.L002`; stable ID `T13.A08.S010.L002`)\n- `Line 3` Tailnet address is `qiserver-1.cerberus-sirius.ts.net` and Tailscale IPv4 is `100.121.111.106`; these are the private access coordinates. (`Sec. 13.08.010.L003`; stable ID `T13.A08.S010.L003`)","headings":[{"level":2,"text":"Article 8. Path Doctrine","id":"article-8-path-doctrine"},{"level":3,"text":"Sec. 13.08.010. Server Path Standards","id":"sec-1308010-server-path-standards"}],"order":18},{"id":"title_14_qiworkers_indexmd","name":"_index.md","relativePath":"title_14_qiworkers/_index.md","category":"TITLE 14 QIWORKERS","title":"Title 14. QiWorkers â€” Index","summary":"Index for QiCode Title 14, QiWorkers.","status":"publish","rawBody":"# Title 14. QiWorkers\n\n- Title Cover\n- Article 1. Worker Purpose\n- Article 2. API Workers\n- Article 3. Ingestion Workers\n- Article 4. Sync and Automation\n- Article 5. Queues and Jobs\n- Article 6. Error Handling\n- Article 7. Deployment Rules","headings":[{"level":1,"text":"Title 14. QiWorkers","id":"title-14-qiworkers"}],"order":0},{"id":"title_14_qiworkerstitle_14_qiworkersmd","name":"title_14_qiworkers.md","relativePath":"title_14_qiworkers/title_14_qiworkers.md","category":"TITLE 14 QIWORKERS","title":"Title 14. QiWorkers","summary":"QiWorkers governs 25_QiWorkers â€” background jobs, API workers, sync tools, queues, and automation.","status":"publish","rawBody":"# Title 14. QiWorkers\n\n## Citation\n\n- Legal citation: `QiCode Title 14`\n- Article citation: `QiCode Title 14, Article #`\n- Section citation: `QiCode Sec. 14.##.###`\n- Stable ID alias: `QiCode T14.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 14.001.L001` This title governs `25_QiWorkers` â€” background jobs, APIs, sync tools, and automation workers. (stable ID `T14.R001.L001`)\n- `Rule 14.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T14.R001.L002`)\n- `Rule 14.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T14.R001.L003`)\n\n## Articles\n\n- Article 1. Worker Purpose\n- Article 2. API Workers\n- Article 3. Ingestion Workers\n- Article 4. Sync and Automation\n- Article 5. Queues and Jobs\n- Article 6. Error Handling\n- Article 7. Deployment Rules\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Title 10 â€” QiLabs](title_10_qilabs.md)\n- [Title 13 â€” QiServer](title_13_qiserver.md)\n- [Migration Map](qilabs_title_migration_map.md)","headings":[{"level":1,"text":"Title 14. QiWorkers","id":"title-14-qiworkers"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_14_qiworkersarticle_01_worker_purposemd","name":"article_01_worker_purpose.md","relativePath":"title_14_qiworkers/article_01_worker_purpose.md","category":"TITLE 14 QIWORKERS","title":"Article 1. Worker Purpose","summary":"","status":"publish","rawBody":"## Article 1. Worker Purpose\n\nStable ID: `T14.A01`\n\n### Sec. 14.01.010. Primary Function\n\nStable ID: `T14.A01.S010`\n\n- `Line 1` QiWorkers holds background jobs, APIs, sync tools, and automation workers that operate across QiLabs domains. (`Sec. 14.01.010.L001`; stable ID `T14.A01.S010.L001`)\n- `Line 2` Workers do not become app UI; interface concerns belong in QiApps. (`Sec. 14.01.010.L002`; stable ID `T14.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 14.01.010.L003`; stable ID `T14.A01.S010.L003`)","headings":[{"level":2,"text":"Article 1. Worker Purpose","id":"article-1-worker-purpose"},{"level":3,"text":"Sec. 14.01.010. Primary Function","id":"sec-1401010-primary-function"}],"order":11},{"id":"title_14_qiworkersarticle_02_api_workersmd","name":"article_02_api_workers.md","relativePath":"title_14_qiworkers/article_02_api_workers.md","category":"TITLE 14 QIWORKERS","title":"Article 2. API Workers","summary":"","status":"publish","rawBody":"## Article 2. API Workers\n\nStable ID: `T14.A02`\n\n### Sec. 14.02.010. API Governance\n\nStable ID: `T14.A02.S010`\n\n- `Line 1` API workers expose callable endpoints that bridge between QiLabs systems and external or internal consumers; Cloudflare Workers are the preferred deployment surface for public-facing API workers. (`Sec. 14.02.010.L001`; stable ID `T14.A02.S010.L001`)\n- `Line 2` Each API worker must have a documented contract (id, trigger, input, output, fleet_context, failure policy). (`Sec. 14.02.010.L002`; stable ID `T14.A02.S010.L002`)\n- `Line 3` Worker state must be logged to `qisys.jobs` as: `queued`, `running`, `completed`, `failed`, or `retrying`. (`Sec. 14.02.010.L003`; stable ID `T14.A02.S010.L003`)\n\n### Sec. 14.02.020. Worker Categories\n\nStable ID: `T14.A02.S020`\n\n- `Line 1` Authorized worker categories include: Graph projection, Retrieval orchestration, Metadata enrichment, Repair/retry job, Background embedding, Sync worker, Enrollment reconciliation, Config distribution, Folder assignment sync, and Node update/repair. (`Sec. 14.02.020.L001`; stable ID `T14.A02.S020.L001`)\n- `Line 2` Workers never redefine canonical identity; they always operate on canonically-identified records (via `canonical_id`). (`Sec. 14.02.020.L002`; stable ID `T14.A02.S020.L002`)\n- `Line 3` Workers never write directly to canonical schemas (`qiarchive`) without going through the pipeline contract. (`Sec. 14.02.020.L003`; stable ID `T14.A02.S020.L003`)","headings":[{"level":2,"text":"Article 2. API Workers","id":"article-2-api-workers"},{"level":3,"text":"Sec. 14.02.010. API Governance","id":"sec-1402010-api-governance"},{"level":3,"text":"Sec. 14.02.020. Worker Categories","id":"sec-1402020-worker-categories"}],"order":12},{"id":"title_14_qiworkersarticle_03_ingestion_workersmd","name":"article_03_ingestion_workers.md","relativePath":"title_14_qiworkers/article_03_ingestion_workers.md","category":"TITLE 14 QIWORKERS","title":"Article 3. Ingestion Workers","summary":"","status":"publish","rawBody":"## Article 3. Ingestion Workers\n\nStable ID: `T14.A03`\n\n### Sec. 14.03.010. Ingestion Governance\n\nStable ID: `T14.A03.S010`\n\n- `Line 1` Ingestion workers handle pulling, transforming, and routing data from external sources into QiLabs systems. (`Sec. 14.03.010.L001`; stable ID `T14.A03.S010.L001`)\n- `Line 2` Ingestion workers must log every operation and expose a status endpoint or dashboard. (`Sec. 14.03.010.L002`; stable ID `T14.A03.S010.L002`)\n- `Line 3` Source material routed by an ingestion worker must retain provenance metadata after ingestion. (`Sec. 14.03.010.L003`; stable ID `T14.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. Ingestion Workers","id":"article-3-ingestion-workers"},{"level":3,"text":"Sec. 14.03.010. Ingestion Governance","id":"sec-1403010-ingestion-governance"}],"order":13},{"id":"title_14_qiworkersarticle_04_sync_and_automationmd","name":"article_04_sync_and_automation.md","relativePath":"title_14_qiworkers/article_04_sync_and_automation.md","category":"TITLE 14 QIWORKERS","title":"Article 4. Sync and Automation","summary":"","status":"publish","rawBody":"## Article 4. Sync and Automation\n\nStable ID: `T14.A04`\n\n### Sec. 14.04.010. Sync Governance\n\nStable ID: `T14.A04.S010`\n\n- `Line 1` Sync workers reconcile state between QiLabs systems; they must be idempotent and recoverable. (`Sec. 14.04.010.L001`; stable ID `T14.A04.S010.L001`)\n- `Line 2` Automation workflows (n8n or equivalent) that cross domain boundaries must be documented in QiWorkers. (`Sec. 14.04.010.L002`; stable ID `T14.A04.S010.L002`)\n- `Line 3` Sync operations must not silently overwrite canonical records without a conflict resolution policy. (`Sec. 14.04.010.L003`; stable ID `T14.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. Sync and Automation","id":"article-4-sync-and-automation"},{"level":3,"text":"Sec. 14.04.010. Sync Governance","id":"sec-1404010-sync-governance"}],"order":14},{"id":"title_14_qiworkersarticle_05_queues_and_jobsmd","name":"article_05_queues_and_jobs.md","relativePath":"title_14_qiworkers/article_05_queues_and_jobs.md","category":"TITLE 14 QIWORKERS","title":"Article 5. Queues and Jobs","summary":"","status":"publish","rawBody":"## Article 5. Queues and Jobs\n\nStable ID: `T14.A05`\n\n### Sec. 14.05.010. Job Queue Policy\n\nStable ID: `T14.A05.S010`\n\n- `Line 1` Long-running or deferred operations must use a queue; fire-and-forget is not acceptable for critical workflows. (`Sec. 14.05.010.L001`; stable ID `T14.A05.L010.L001`)\n- `Line 2` Queue failures must be logged, alerted, and recoverable without manual data reconstruction. (`Sec. 14.05.010.L002`; stable ID `T14.A05.S010.L002`)\n- `Line 3` Job retention and dead-letter policy must be documented for each queue. (`Sec. 14.05.010.L003`; stable ID `T14.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. Queues and Jobs","id":"article-5-queues-and-jobs"},{"level":3,"text":"Sec. 14.05.010. Job Queue Policy","id":"sec-1405010-job-queue-policy"}],"order":15},{"id":"title_14_qiworkersarticle_06_error_handlingmd","name":"article_06_error_handling.md","relativePath":"title_14_qiworkers/article_06_error_handling.md","category":"TITLE 14 QIWORKERS","title":"Article 6. Error Handling","summary":"","status":"publish","rawBody":"## Article 6. Error Handling\n\nStable ID: `T14.A06`\n\n### Sec. 14.06.010. Error Policy\n\nStable ID: `T14.A06.S010`\n\n- `Line 1` Workers must be observable: every worker must emit structured logs accessible without SSH. (`Sec. 14.06.010.L001`; stable ID `T14.A06.S010.L001`)\n- `Line 2` Workers must be recoverable: failure state must not require manual reconstruction of lost work. (`Sec. 14.06.010.L002`; stable ID `T14.A06.S010.L002`)\n- `Line 3` Workers must be documented: the runbook for each worker must exist before it is deployed. (`Sec. 14.06.010.L003`; stable ID `T14.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Error Handling","id":"article-6-error-handling"},{"level":3,"text":"Sec. 14.06.010. Error Policy","id":"sec-1406010-error-policy"}],"order":16},{"id":"title_14_qiworkersarticle_07_deployment_rulesmd","name":"article_07_deployment_rules.md","relativePath":"title_14_qiworkers/article_07_deployment_rules.md","category":"TITLE 14 QIWORKERS","title":"Article 7. Deployment Rules","summary":"","status":"publish","rawBody":"## Article 7. Deployment Rules\n\nStable ID: `T14.A07`\n\n### Sec. 14.07.010. Deployment Governance\n\nStable ID: `T14.A07.S010`\n\n- `Line 1` Workers are deployed to QiServer (Docker), Cloudflare Workers, or an equivalent governed runtime. (`Sec. 14.07.010.L001`; stable ID `T14.A07.S010.L001`)\n- `Line 2` Deployment configuration must be version-controlled in `25_QiWorkers`. (`Sec. 14.07.010.L002`; stable ID `T14.A07.S010.L002`)\n- `Line 3` Environment secrets must not be committed to source control; use `.env.example` and a secrets manager. (`Sec. 14.07.010.L003`; stable ID `T14.A07.S010.L003`)","headings":[{"level":2,"text":"Article 7. Deployment Rules","id":"article-7-deployment-rules"},{"level":3,"text":"Sec. 14.07.010. Deployment Governance","id":"sec-1407010-deployment-governance"}],"order":17},{"id":"title_15_qidrive_indexmd","name":"_index.md","relativePath":"title_15_qidrive/_index.md","category":"TITLE 15 QIDRIVE","title":"Title 15. QiDrive â€” Index","summary":"Index for QiCode Title 15, QiDrive.","status":"publish","rawBody":"# Title 15. QiDrive\n\n- Title Cover\n- Article 1. QiDrive Purpose\n- Article 2. Drive as Source of Truth\n- Article 3. Ingestion\n- Article 4. Files and Evidence\n- Article 5. Folder Structure\n- Article 6. Protected Records\n- Article 7. Archive and Retention","headings":[{"level":1,"text":"Title 15. QiDrive","id":"title-15-qidrive"}],"order":0},{"id":"title_15_qidrivetitle_15_qidrivemd","name":"title_15_qidrive.md","relativePath":"title_15_qidrive/title_15_qidrive.md","category":"TITLE 15 QIDRIVE","title":"Title 15. QiDrive","summary":"QiDrive governs 30_QiDrive â€” the file and markdown source-of-truth layer for files, evidence, docs, and archives.","status":"publish","rawBody":"# Title 15. QiDrive\n\n## Citation\n\n- Legal citation: `QiCode Title 15`\n- Article citation: `QiCode Title 15, Article #`\n- Section citation: `QiCode Sec. 15.##.###`\n- Stable ID alias: `QiCode T15.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 15.001.L001` This title governs `30_QiDrive` â€” the file and markdown source-of-truth layer. (stable ID `T15.R001.L001`)\n- `Rule 15.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T15.R001.L002`)\n- `Rule 15.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T15.R001.L003`)\n\n## Articles\n\n- Article 1. QiDrive Purpose\n- Article 2. Drive as Source of Truth\n- Article 3. Ingestion\n- Article 4. Files and Evidence\n- Article 5. Folder Structure\n- Article 6. Protected Records\n- Article 7. Archive and Retention\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Title 10 â€” QiLabs](title_10_qilabs.md)\n- [Migration Map](qilabs_title_migration_map.md)","headings":[{"level":1,"text":"Title 15. QiDrive","id":"title-15-qidrive"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_15_qidrivearticle_01_qidrive_purposemd","name":"article_01_qidrive_purpose.md","relativePath":"title_15_qidrive/article_01_qidrive_purpose.md","category":"TITLE 15 QIDRIVE","title":"Article 1. QiDrive Purpose","summary":"","status":"publish","rawBody":"## Article 1. QiDrive Purpose\n\nStable ID: `T15.A01`\n\n### Sec. 15.01.010. Primary Function\n\nStable ID: `T15.A01.S010`\n\n- `Line 1` QiDrive is the file and markdown source-of-truth layer: files, evidence, docs, assets, exports, and archives. (`Sec. 15.01.010.L001`; stable ID `T15.A01.S010.L001`)\n- `Line 2` QiApps are interface layers; QiDrive preserves the source material that apps display or operate on. (`Sec. 15.01.010.L002`; stable ID `T15.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 15.01.010.L003`; stable ID `T15.A01.S010.L003`)","headings":[{"level":2,"text":"Article 1. QiDrive Purpose","id":"article-1-qidrive-purpose"},{"level":3,"text":"Sec. 15.01.010. Primary Function","id":"sec-1501010-primary-function"}],"order":11},{"id":"title_15_qidrivearticle_02_drive_as_source_of_truthmd","name":"article_02_drive_as_source_of_truth.md","relativePath":"title_15_qidrive/article_02_drive_as_source_of_truth.md","category":"TITLE 15 QIDRIVE","title":"Article 2. Drive as Source of Truth","summary":"","status":"publish","rawBody":"## Article 2. Drive as Source of Truth\n\nStable ID: `T15.A02`\n\n### Sec. 15.02.010. Google Drive as Primary Runtime\n\nStable ID: `T15.A02.S010`\n\n- `Line 1` Google Drive is the primary runtime for QiDrive files and is governed by QiDrive doctrine. (`Sec. 15.02.010.L001`; stable ID `T15.A02.S010.L001`)\n- `Line 2` Local `30_QiDrive` is the vault-facing mirror or staging area; Google Drive is the live source. (`Sec. 15.02.010.L002`; stable ID `T15.A02.S010.L002`)\n- `Line 3` Conflicts between local and cloud versions must default to the cloud version unless a conflict policy exists. (`Sec. 15.02.010.L003`; stable ID `T15.A02.S010.L003`)","headings":[{"level":2,"text":"Article 2. Drive as Source of Truth","id":"article-2-drive-as-source-of-truth"},{"level":3,"text":"Sec. 15.02.010. Google Drive as Primary Runtime","id":"sec-1502010-google-drive-as-primary-runtime"}],"order":12},{"id":"title_15_qidrivearticle_03_ingestionmd","name":"article_03_ingestion.md","relativePath":"title_15_qidrive/article_03_ingestion.md","category":"TITLE 15 QIDRIVE","title":"Article 3. Ingestion","summary":"","status":"publish","rawBody":"## Article 3. Ingestion\n\nStable ID: `T15.A03`\n\n### Sec. 15.03.010. Ingestion Policy\n\nStable ID: `T15.A03.S010`\n\n- `Line 1` Files enter QiDrive through a documented ingestion path; drop-copying without metadata is not permitted for source material. (`Sec. 15.03.010.L001`; stable ID `T15.A03.S010.L001`)\n- `Line 2` Ingested files must carry at minimum: source, date, sensitivity classification, and content type. (`Sec. 15.03.010.L002`; stable ID `T15.A03.S010.L002`)\n- `Line 3` QiSpark docs may be authored as markdown in QiDrive and published through QiSpark build pipelines. (`Sec. 15.03.010.L003`; stable ID `T15.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. Ingestion","id":"article-3-ingestion"},{"level":3,"text":"Sec. 15.03.010. Ingestion Policy","id":"sec-1503010-ingestion-policy"}],"order":13},{"id":"title_15_qidrivearticle_04_files_and_evidencemd","name":"article_04_files_and_evidence.md","relativePath":"title_15_qidrive/article_04_files_and_evidence.md","category":"TITLE 15 QIDRIVE","title":"Article 4. Files and Evidence","summary":"","status":"publish","rawBody":"## Article 4. Files and Evidence\n\nStable ID: `T15.A04`\n\n### Sec. 15.04.010. Evidence Handling\n\nStable ID: `T15.A04.S010`\n\n- `Line 1` Evidence files carry heightened protection and must not be moved, renamed, or modified without documented justification. (`Sec. 15.04.010.L001`; stable ID `T15.A04.S010.L001`)\n- `Line 2` Evidence files must retain original metadata and file integrity checksums where available. (`Sec. 15.04.010.L002`; stable ID `T15.A04.S010.L002`)\n- `Line 3` Access to evidence files is governed by the sensitivity classification in the file's frontmatter or container record. (`Sec. 15.04.010.L003`; stable ID `T15.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. Files and Evidence","id":"article-4-files-and-evidence"},{"level":3,"text":"Sec. 15.04.010. Evidence Handling","id":"sec-1504010-evidence-handling"}],"order":14},{"id":"title_15_qidrivearticle_05_folder_structuremd","name":"article_05_folder_structure.md","relativePath":"title_15_qidrive/article_05_folder_structure.md","category":"TITLE 15 QIDRIVE","title":"Article 5. Folder Structure","summary":"","status":"publish","rawBody":"## Article 5. Folder Structure\n\nStable ID: `T15.A05`\n\n### Sec. 15.05.010. Folder Organization\n\nStable ID: `T15.A05.S010`\n\n- `Line 1` QiDrive folder structure must reflect the governed domain hierarchy documented in the QiCode title map. (`Sec. 15.05.010.L001`; stable ID `T15.A05.S010.L001`)\n- `Line 2` Ad hoc folders must not be created without documentation in the corresponding domain title. (`Sec. 15.05.010.L002`; stable ID `T15.A05.S010.L002`)\n- `Line 3` Top-level Drive folders mirror QiLabs root domain bands where applicable. (`Sec. 15.05.010.L003`; stable ID `T15.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. Folder Structure","id":"article-5-folder-structure"},{"level":3,"text":"Sec. 15.05.010. Folder Organization","id":"sec-1505010-folder-organization"}],"order":15},{"id":"title_15_qidrivearticle_06_protected_recordsmd","name":"article_06_protected_records.md","relativePath":"title_15_qidrive/article_06_protected_records.md","category":"TITLE 15 QIDRIVE","title":"Article 6. Protected Records","summary":"","status":"publish","rawBody":"## Article 6. Protected Records\n\nStable ID: `T15.A06`\n\n### Sec. 15.06.010. Protection Policy\n\nStable ID: `T15.A06.S010`\n\n- `Line 1` Legal records, evidence, medical records, and financial records in QiDrive are protected and governed by enhanced retention rules. (`Sec. 15.06.010.L001`; stable ID `T15.A06.S010.L001`)\n- `Line 2` Protected records must not be deleted, renamed, or moved without an explicit governance decision. (`Sec. 15.06.010.L002`; stable ID `T15.A06.S010.L002`)\n- `Line 3` Protected records must carry `sensitivity: confidential` or higher in their frontmatter or folder-level policy. (`Sec. 15.06.010.L003`; stable ID `T15.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Protected Records","id":"article-6-protected-records"},{"level":3,"text":"Sec. 15.06.010. Protection Policy","id":"sec-1506010-protection-policy"}],"order":16},{"id":"title_15_qidrivearticle_07_archive_and_retentionmd","name":"article_07_archive_and_retention.md","relativePath":"title_15_qidrive/article_07_archive_and_retention.md","category":"TITLE 15 QIDRIVE","title":"Article 7. Archive and Retention","summary":"","status":"publish","rawBody":"## Article 7. Archive and Retention\n\nStable ID: `T15.A07`\n\n### Sec. 15.07.010. Archive Policy\n\nStable ID: `T15.A07.S010`\n\n- `Line 1` Archived material must be moved to a clearly labeled archive folder; delete is not acceptable for source-of-truth material. (`Sec. 15.07.010.L001`; stable ID `T15.A07.S010.L001`)\n- `Line 2` Retention periods for protected records must be documented and respected. (`Sec. 15.07.010.L002`; stable ID `T15.A07.S010.L002`)\n- `Line 3` Archive actions must be logged in the domain's changelog or a migration record. (`Sec. 15.07.010.L003`; stable ID `T15.A07.S010.L003`)","headings":[{"level":2,"text":"Article 7. Archive and Retention","id":"article-7-archive-and-retention"},{"level":3,"text":"Sec. 15.07.010. Archive Policy","id":"sec-1507010-archive-policy"}],"order":17},{"id":"title_16_qivault_indexmd","name":"_index.md","relativePath":"title_16_qivault/_index.md","category":"TITLE 16 QIVAULT","title":"Title 16. QiVault â€” Index","summary":"Index for QiCode Title 16, QiVault.","status":"publish","rawBody":"# Title 16. QiVault\n\n- Title Cover\n- Article 1. Vault Purpose\n- Article 2. Markdown Rules\n- Article 3. Indexes\n- Article 4. Links and Backlinks\n- Article 5. Frontmatter\n- Article 6. Knowledge Boundaries\n- Article 7. Sync and Archive","headings":[{"level":1,"text":"Title 16. QiVault","id":"title-16-qivault"}],"order":0},{"id":"title_16_qivaulttitle_16_qivaultmd","name":"title_16_qivault.md","relativePath":"title_16_qivault/title_16_qivault.md","category":"TITLE 16 QIVAULT","title":"Title 16. QiVault","summary":"QiVault governs 40_QiVault â€” the markdown vault, local knowledge workspace, and frontmatter-governed note system.","status":"publish","rawBody":"# Title 16. QiVault\n\n## Citation\n\n- Legal citation: `QiCode Title 16`\n- Article citation: `QiCode Title 16, Article #`\n- Section citation: `QiCode Sec. 16.##.###`\n- Stable ID alias: `QiCode T16.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 16.001.L001` This title governs `40_QiVault` â€” the markdown vault and local knowledge workspace. (stable ID `T16.R001.L001`)\n- `Rule 16.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T16.R001.L002`)\n- `Rule 16.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T16.R001.L003`)\n\n## Articles\n\n- Article 1. Vault Purpose\n- Article 2. Markdown Rules\n- Article 3. Indexes\n- Article 4. Links and Backlinks\n- Article 5. Frontmatter\n- Article 6. Knowledge Boundaries\n- Article 7. Sync and Archive\n\n## Cross References\n\n-[QiCode Index](00_QiCode/_index.md))\n-[Title 10 â€” QiLabs](title_10_qilabs.md))\n-[Migration Map](qilabs_title_migration_map.md))","headings":[{"level":1,"text":"Title 16. QiVault","id":"title-16-qivault"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_16_qivaultarticle_01_vault_purposemd","name":"article_01_vault_purpose.md","relativePath":"title_16_qivault/article_01_vault_purpose.md","category":"TITLE 16 QIVAULT","title":"Article 1. Vault Purpose","summary":"","status":"publish","rawBody":"## Article 1. Vault Purpose\n\nStable ID: `T16.A01`\n\n### Sec. 16.01.010. Primary Function\n\nStable ID: `T16.A01.S010`\n\n- `Line 1` QiVault is the markdown vault and local knowledge workspace: notes, journals, indexes, and local doctrine. (`Sec. 16.01.010.L001`; stable ID `T16.A01.S010.L001`)\n- `Line 2` QiVault may mirror or stage markdown knowledge that originates in QiDrive or other sources. (`Sec. 16.01.010.L002`; stable ID `T16.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 16.01.010.L003`; stable ID `T16.A01.S010.L003`)\n\n### Sec. 16.01.020. Vault vs. Drive\n\nStable ID: `T16.A01.S020`\n\n- `Line 1` QiVault is not the same as QiDrive when QiDrive is acting as the source of truth for files. (`Sec. 16.01.020.L001`; stable ID `T16.A01.S020.L001`)\n- `Line 2` Do not duplicate canonical docs between vault and drive without a clear source mapping in frontmatter. (`Sec. 16.01.020.L002`; stable ID `T16.A01.S020.L002`)\n- `Line 3` When a markdown file exists in both places, the one with `source_type: manual` and a `canonical_ref` wins. (`Sec. 16.01.020.L003`; stable ID `T16.A01.S020.L003`)","headings":[{"level":2,"text":"Article 1. Vault Purpose","id":"article-1-vault-purpose"},{"level":3,"text":"Sec. 16.01.010. Primary Function","id":"sec-1601010-primary-function"},{"level":3,"text":"Sec. 16.01.020. Vault vs. Drive","id":"sec-1601020-vault-vs-drive"}],"order":11},{"id":"title_16_qivaultarticle_02_markdown_rulesmd","name":"article_02_markdown_rules.md","relativePath":"title_16_qivault/article_02_markdown_rules.md","category":"TITLE 16 QIVAULT","title":"Article 2. Markdown Rules","summary":"","status":"publish","rawBody":"## Article 2. Markdown Rules\n\nStable ID: `T16.A02`\n\n### Sec. 16.02.010. Frontmatter Requirement\n\nStable ID: `T16.A02.S010`\n\n- `Line 1` All markdown files in QiVault must carry valid frontmatter as defined by the master template. (`Sec. 16.02.010.L001`; stable ID `T16.A02.S010.L001`)\n- `Line 2` Frontmatter keys defined as required in the housekeeping config must not be absent or empty. (`Sec. 16.02.010.L002`; stable ID `T16.A02.S010.L002`)\n- `Line 3` List-type fields (`tags`, `keywords`, `aliases`) must use YAML block scalar format, not inline `[]` followed by dangling list items. (`Sec. 16.02.010.L003`; stable ID `T16.A02.S010.L003`)","headings":[{"level":2,"text":"Article 2. Markdown Rules","id":"article-2-markdown-rules"},{"level":3,"text":"Sec. 16.02.010. Frontmatter Requirement","id":"sec-1602010-frontmatter-requirement"}],"order":12},{"id":"title_16_qivaultarticle_03_indexesmd","name":"article_03_indexes.md","relativePath":"title_16_qivault/article_03_indexes.md","category":"TITLE 16 QIVAULT","title":"Article 3. Indexes","summary":"","status":"publish","rawBody":"## Article 3. Indexes\n\nStable ID: `T16.A03`\n\n### Sec. 16.03.010. Index Policy\n\nStable ID: `T16.A03.S010`\n\n- `Line 1` Each significant folder in QiVault must have an `_index.md` that describes the folder's purpose. (`Sec. 16.03.010.L001`; stable ID `T16.A03.S010.L001`)\n- `Line 2` Index files must not be deleted by housekeeping tools; they are protected files. (`Sec. 16.03.010.L002`; stable ID `T16.A03.S010.L002`)\n- `Line 3` Generated index blocks must be clearly marked with housekeeping managed block comments. (`Sec. 16.03.010.L003`; stable ID `T16.A03.S010.L003`)","headings":[{"level":2,"text":"Article 3. Indexes","id":"article-3-indexes"},{"level":3,"text":"Sec. 16.03.010. Index Policy","id":"sec-1603010-index-policy"}],"order":13},{"id":"title_16_qivaultarticle_04_links_and_backlinksmd","name":"article_04_links_and_backlinks.md","relativePath":"title_16_qivault/article_04_links_and_backlinks.md","category":"TITLE 16 QIVAULT","title":"Article 4. Links and Backlinks","summary":"","status":"publish","rawBody":"## Article 4. Links and Backlinks\n\nStable ID: `T16.A04`\n\n### Sec. 16.04.010. Link Integrity\n\nStable ID: `T16.A04.S010`\n\n- `Line 1` Obsidian wiki-links within the vault must use stable file slugs or paths, not display names. (`Sec. 16.04.010.L001`; stable ID `T16.A04.S010.L001`)\n- `Line 2` Link rewrites must not be run globally without a separately approved rewrite plan. (`Sec. 16.04.010.L002`; stable ID `T16.A04.S010.L002`)\n- `Line 3` Broken links are surfaced in housekeeping reports; they must be resolved, not silently patched. (`Sec. 16.04.010.L003`; stable ID `T16.A04.S010.L003`)","headings":[{"level":2,"text":"Article 4. Links and Backlinks","id":"article-4-links-and-backlinks"},{"level":3,"text":"Sec. 16.04.010. Link Integrity","id":"sec-1604010-link-integrity"}],"order":14},{"id":"title_16_qivaultarticle_05_frontmattermd","name":"article_05_frontmatter.md","relativePath":"title_16_qivault/article_05_frontmatter.md","category":"TITLE 16 QIVAULT","title":"Article 5. Frontmatter","summary":"","status":"publish","rawBody":"## Article 5. Frontmatter\n\nStable ID: `T16.A05`\n\n### Sec. 16.05.010. Frontmatter Governance\n\nStable ID: `T16.A05.S010`\n\n- `Line 1` The canonical frontmatter standard is defined in the master template at `00_QiLabs.workspace/_qiconfig/master_template.md`. (`Sec. 16.05.010.L001`; stable ID `T16.A05.S010.L001`)\n- `Line 2` Housekeeping may add missing required keys but must not overwrite non-empty values without explicit approval. (`Sec. 16.05.010.L002`; stable ID `T16.A05.S010.L002`)\n- `Line 3` Tags must be registered in the global tag registry before use; unknown tags are surfaced as warnings. (`Sec. 16.05.010.L003`; stable ID `T16.A05.S010.L003`)","headings":[{"level":2,"text":"Article 5. Frontmatter","id":"article-5-frontmatter"},{"level":3,"text":"Sec. 16.05.010. Frontmatter Governance","id":"sec-1605010-frontmatter-governance"}],"order":15},{"id":"title_16_qivaultarticle_06_knowledge_boundariesmd","name":"article_06_knowledge_boundaries.md","relativePath":"title_16_qivault/article_06_knowledge_boundaries.md","category":"TITLE 16 QIVAULT","title":"Article 6. Knowledge Boundaries","summary":"","status":"publish","rawBody":"## Article 6. Knowledge Boundaries\n\nStable ID: `T16.A06`\n\n### Sec. 16.06.010. Knowledge Placement\n\nStable ID: `T16.A06.S010`\n\n- `Line 1` Personal knowledge, journals, notes, and life records belong in QiVault. (`Sec. 16.06.010.L001`; stable ID `T16.A06.S010.L001`)\n- `Line 2` Developer system docs belong in QiSpark or the relevant domain title, not the personal vault. (`Sec. 16.06.010.L002`; stable ID `T16.A06.S010.L002`)\n- `Line 3` Vault content must not be published without a `publish_target` declaration and sensitivity review. (`Sec. 16.06.010.L003`; stable ID `T16.A06.S010.L003`)","headings":[{"level":2,"text":"Article 6. Knowledge Boundaries","id":"article-6-knowledge-boundaries"},{"level":3,"text":"Sec. 16.06.010. Knowledge Placement","id":"sec-1606010-knowledge-placement"}],"order":16},{"id":"title_16_qivaultarticle_07_sync_and_archivemd","name":"article_07_sync_and_archive.md","relativePath":"title_16_qivault/article_07_sync_and_archive.md","category":"TITLE 16 QIVAULT","title":"Article 7. Sync and Archive","summary":"","status":"publish","rawBody":"## Article 7. Sync and Archive\n\nStable ID: `T16.A07`\n\n### Sec. 16.07.010. Vault Sync Policy\n\nStable ID: `T16.A07.S010`\n\n- `Line 1` QiVault is version-controlled in its own git repository; commits are the canonical record of vault state. (`Sec. 16.07.010.L001`; stable ID `T16.A07.S010.L001`)\n- `Line 2` Obsidian and Smart Env plugin files (`.obsidian/`, `.smart-env/`) are tracked but not treated as canonical knowledge. (`Sec. 16.07.010.L002`; stable ID `T16.A07.S010.L002`)\n- `Line 3` Archived vault material is moved to `99_archive` with a clear archive date and reason. (`Sec. 16.07.010.L003`; stable ID `T16.A07.S010.L003`)","headings":[{"level":2,"text":"Article 7. Sync and Archive","id":"article-7-sync-and-archive"},{"level":3,"text":"Sec. 16.07.010. Vault Sync Policy","id":"sec-1607010-vault-sync-policy"}],"order":17},{"id":"title_17_qiapps_indexmd","name":"_index.md","relativePath":"title_17_qiapps/_index.md","category":"TITLE 17 QIAPPS","title":"Title 17. QiApps â€” Index","summary":"Index for QiCode Title 17, QiApps.","status":"publish","rawBody":"# Title 17. QiApps\n\n- Title Cover\n- Article 1. QiApps Purpose\n- Article 2. App Project Rules\n- Article 3. QiLife\n- Article 4. QiFinance (Firefly)\n- Article 5. CareLite\n- Article 6. Experiments\n- Article 7. App Lifecycle","headings":[{"level":1,"text":"Title 17. QiApps","id":"title-17-qiapps"}],"order":0},{"id":"title_17_qiappstitle_17_qiappsmd","name":"title_17_qiapps.md","relativePath":"title_17_qiapps/title_17_qiapps.md","category":"TITLE 17 QIAPPS","title":"Title 17. QiApps","summary":"QiApps governs 60_QiApps â€” all app projects, UI layers, and product tools within the QiLabs ecosystem.","status":"publish","rawBody":"# Title 17. QiApps\n\n## Citation\n\n- Legal citation: `QiCode Title 17`\n- Article citation: `QiCode Title 17, Article #`\n- Section citation: `QiCode Sec. 17.##.###`\n- Stable ID alias: `QiCode T17.A##.S###.L###`\n\n## Rule of Construction\n\n- `Rule 17.001.L001` This title governs `60_QiApps` â€” app projects, UI layers, and product tools. (stable ID `T17.R001.L001`)\n- `Rule 17.001.L002` A section states a governing principle; a line states a citeable rule or application. (stable ID `T17.R001.L002`)\n- `Rule 17.001.L003` Exceptions must be named, reviewed, and linked to the record that justifies them. (stable ID `T17.R001.L003`)\n\n## Articles\n\n- Article 1. QiApps Purpose\n- Article 2. App Project Rules\n- Article 3. QiLife\n- Article 4. QiFinance (Firefly)\n- Article 5. CareLite\n- Article 6. Experiments\n- Article 7. App Lifecycle\n\n## Cross References\n\n- [QiCode Index](00_QiCode/_index.md)\n- [Title 10 â€” QiLabs](title_10_qilabs.md)\n- [Migration Map](qilabs_title_migration_map.md)","headings":[{"level":1,"text":"Title 17. QiApps","id":"title-17-qiapps"},{"level":2,"text":"Citation","id":"citation"},{"level":2,"text":"Rule of Construction","id":"rule-of-construction"},{"level":2,"text":"Articles","id":"articles"},{"level":2,"text":"Cross References","id":"cross-references"}],"order":1},{"id":"title_17_qiappsarticle_01_qiapps_purposemd","name":"article_01_qiapps_purpose.md","relativePath":"title_17_qiapps/article_01_qiapps_purpose.md","category":"TITLE 17 QIAPPS","title":"Article 1. QiApps Purpose","summary":"","status":"publish","rawBody":"## Article 1. QiApps Purpose\n\nStable ID: `T17.A01`\n\n### Sec. 17.01.010. Primary Function\n\nStable ID: `T17.A01.S010`\n\n- `Line 1` QiApps contains app projects and UI/tooling layers: products that users or operators directly interact with. (`Sec. 17.01.010.L001`; stable ID `T17.A01.S010.L001`)\n- `Line 2` QiApps does not become the source of truth unless explicitly defined in the app's governing doctrine. (`Sec. 17.01.010.L002`; stable ID `T17.A01.S010.L002`)\n- `Line 3` If use is ambiguous, the placement rule for the nearest parent title controls. (`Sec. 17.01.010.L003`; stable ID `T17.A01.S010.L003`)\n\n### Sec. 17.01.020. Data Flow Rule\n\nStable ID: `T17.A01.S020`\n\n- `Line 1` Apps read from and write to approved source layers (Supabase, QiDrive, QiVault) through documented APIs. (`Sec. 17.01.020.L001`; stable ID `T17.A01.S020.L001`)\n- `Line 2` Apps must not hold canonical data directly; they surface, transform, and display it. (`Sec. 17.01.020.L002`; stable ID `T17.A01.S020.L002`)\n- `Line 3` Any app that holds canonical data must declare it as a source in its title doctrine. (`Sec. 17.01.020.L003`; stable ID `T17.A01.S020.L003`)","headings":[{"level":2,"text":"Article 1. QiApps Purpose","id":"article-1-qiapps-purpose"},{"level":3,"text":"Sec. 17.01.010. Primary Function","id":"sec-1701010-primary-function"},{"level":3,"text":"Sec. 17.01.020. Data Flow Rule","id":"sec-1701020-data-flow-rule"}],"order":11},{"id":"title_17_qiappsarticle_02_app_project_rulesmd","name":"article_02_app_project_rules.md","relativePath":"title_17_qiapps/article_02_app_project_rules.md","category":"TITLE 17 QIAPPS","title":"Article 2. App Project Rules","summary":"","status":"publish","rawBody":"## Article 2. App Project Rules\n\nStable ID: `T17.A02`\n\n### Sec. 17.02.010. Project Structure\n\nStable ID: `T17.A02.S010`\n\n- `Line 1` Each app project under `60_QiApps` must have a numbered subfolder and a product doctrine document. (`Sec. 17.02.010.L001`; stable ID `T17.A02.S010.L001`)\n- `Line 2` Governed apps include QiLife (`40_QiLife`), QiJourney (`30_QiJourney`), GINA (`10_GINA`), CareLite (`10_CareLite`), and Firefly (`firefly.md`). QiAccess (`20_QiAccess`) is retired as a standalone app and merged into Homepage. (`Sec. 17.02.010.L002`; stable ID `T17.A02.S010.L002`)\n- `Line
