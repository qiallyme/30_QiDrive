{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "QiCode system conformance",
  "type": "object",
  "required": ["system_id", "conformance"],
  "properties": {
    "system_id": { "type": "string", "minLength": 1 },
    "conformance": {
      "type": "array",
      "items": {
        "type": "object",
        "required": ["system_id", "provision_id", "status", "evidence", "verified_at", "verified_by", "notes"],
        "properties": {
          "system_id": { "type": "string" },
          "provision_id": { "type": "string", "pattern": "^QIC-[0-9]{2}-[0-9]{2}-[0-9]{3}$" },
          "status": { "enum": ["aligned", "partial", "missing", "superseded", "deferred", "not_applicable", "unverified"] },
          "evidence": { "type": "array" },
          "verified_at": { "type": ["string", "null"] },
          "verified_by": { "type": ["string", "null"] },
          "notes": { "type": "string" }
        }
      }
    }
  }
}
